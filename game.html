<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>레일런 — 코레일 미니게임 프로토타입</title>
<style>
  :root{
    --navy:#0b1226;
    --korail-blue:#2f6bff;
    --signal-green:#22c55e;
    --signal-yellow:#facc15;
    --signal-red:#ef4444;
    --text:#eef2ff;
    --dim:#93a1c9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--navy)}
  body{
    font-family:Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    color:var(--text);touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}

  /* 배경 아트워크(img/bg_night.png) — 하늘·달·별·구름을 전부 담당한다.
     캔버스보다 DOM 상 먼저 놓여서 항상 맨 뒤에 깔린다. */
  #bgArt{position:fixed;inset:0;background:var(--navy) url('img/bg_night.png') center center/cover no-repeat;
    transform:scale(1);transition:transform .32s ease-in-out;will-change:transform}
  #bgArt.boost{transform:scale(1.03)}   /* 부스터 중 미세 줌 — 별 패럴랙스 대체 속도감 */
  @media (prefers-reduced-motion: reduce){
    #bgArt,#bgArt.boost{transform:none;transition:none}
  }

  #hud{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .km{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;transition:transform .08s}
  .km.pop{transform:scale(1.12)}
  .km small{font-size:16px;font-weight:600;color:var(--dim);margin-left:4px}
  .next{margin-top:6px;font-size:13px;color:var(--dim)}
  .next b{color:var(--text)}
  #scene{margin-top:5px;font-size:12px;color:var(--dim);text-shadow:0 1px 3px rgba(0,0,0,.7)}
  #combo{margin-top:8px;font-size:15px;font-weight:800;color:var(--signal-yellow);opacity:0;transition:opacity .2s}
  #combo.show{opacity:1}

  #gaugebar{position:fixed;top:0;left:0;height:4px;width:100%;transform-origin:left;background:var(--signal-green);z-index:6}

  /* ══════════ 네온 밤하늘 비주얼 업그레이드 ══════════ */
  #meteors{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
  .meteor{position:absolute;top:0;left:0;width:110px;height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,0), #eaf6ff 85%);
    border-radius:2px;filter:drop-shadow(0 0 4px #bfe4ff) drop-shadow(0 0 8px #38BDF8);
    transform-origin:left center;animation:meteorFall linear forwards}
  @keyframes meteorFall{
    0%{opacity:0;transform:translate(0,0) rotate(35deg) scaleX(.3)}
    12%{opacity:1;transform:translate(0,0) rotate(35deg) scaleX(1)}
    88%{opacity:1}
    100%{opacity:0;transform:translate(240px,168px) rotate(35deg) scaleX(1)}
  }
  /* ══════════ 홈 진입 연출: 화면이 켜지듯 ══════════
     스플래시가 불투명 전면 이미지라, 뒤의 배경·캔버스는 어차피 가려진다.
     그래서 연출 대상은 스플래시 두 겹뿐이다 — 주변 발광(blur)이 먼저 올라오고,
     아트워크가 살짝 축소되며 밝아진다.

     body.booted 는 페이지가 "실제로 보이는" 시점(pageshow)에 붙는다.
     transition.js 가 body 를 투명하게 잡고 있다가 pageshow 에 드러내므로,
     그 전에 재생하면 안 보이는 사이에 다 끝나버린다.
     fill-mode 는 backwards — 끝나면 원래 CSS 상태로 돌아가므로
     .splash-stage 의 중앙정렬 transform 이나 .splash-blur 의 blur 를 잠그지 않는다. */
  body:not(.booted) .splash-blur,
  body:not(.booted) .splash-stage{opacity:0}
  @keyframes bootBlur { from{opacity:0} to{opacity:1} }
  @keyframes bootStage{
    from{opacity:0; transform:translate(-50%,-50%) scale(1.03); filter:brightness(.4) saturate(.7)}
    to  {opacity:1; transform:translate(-50%,-50%) scale(1);    filter:none}
  }
  body.booted .splash-blur { animation:bootBlur .7s ease-out backwards }
  body.booted .splash-stage{ animation:bootStage .9s cubic-bezier(.2,.8,.2,1) .12s backwards }

  @media (prefers-reduced-motion: reduce){
    body:not(.booted) .splash-blur,
    body:not(.booted) .splash-stage{opacity:1}
    body.booted .splash-blur,
    body.booted .splash-stage{animation:none}
  }

  /* ══════════ 부스터 ══════════ */
  /* 다이나믹 비네트: 주변시야 자극 완화 (모션 아님 → reduced-motion 에서도 유지) */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
    transition:opacity .3s ease;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(4,7,18,.92) 100%)}
  #vignette.on{opacity:.28}

  /* 부스터 게이지 UI: 원형 카운트다운 링 + 입력 진행 바 */
  .boost-ui{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
    transition:opacity .2s}
  .boost-ring{position:relative;width:48px;height:48px}
  .boost-ring svg{width:48px;height:48px;transform:rotate(-90deg)}
  .boost-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
  .ring-track{stroke:rgba(255,255,255,.12)}
  .ring-prog{stroke:var(--korail-blue);transition:stroke .2s;
    stroke-dasharray:125.66}   /* 2πr, r=20 (JS 의 RING_C 와 동일) */
  .boost-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .boost-bar{width:60px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  .boost-bar i{display:block;height:100%;width:0;background:var(--korail-blue);border-radius:3px;
    transition:width .12s linear,background .2s}
  .boost-lbl{font-size:10px;letter-spacing:1px;color:var(--dim);font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.7)}

  .boost-ui.success .ring-prog,.boost-ui.boosting .ring-prog{stroke:var(--signal-green)}
  .boost-ui.success .boost-bar i,.boost-ui.boosting .boost-bar i{background:var(--signal-green)}
  .boost-ui.boosting .boost-lbl{color:var(--signal-green)}
  .boost-ui.success{animation:boostFlash .6s ease-out}
  @keyframes boostFlash{
    0%{filter:drop-shadow(0 0 0 rgba(34,197,94,0))}
    30%{filter:drop-shadow(0 0 12px rgba(34,197,94,.95))}
    100%{filter:drop-shadow(0 0 0 rgba(34,197,94,0))}
  }
  /* 실패 피드백: 화면 전체가 아니라 이 UI 요소만 살짝 */
  .boost-ui.fail{animation:boostNudge .22s ease-out}
  @keyframes boostNudge{
    0%,100%{transform:translateX(0)}
    30%{transform:translateX(-3px)}
    70%{transform:translateX(3px)}
  }
  /* 쿨다운: 흐릿하게 남은 시간 표시 */
  .boost-ui.cooldown{opacity:.45}
  .boost-ui.cooldown .boost-bar i{background:var(--dim)}
  .boost-ui.cooldown .ring-prog{stroke:var(--dim)}

  @media (prefers-reduced-motion: reduce){
    .boost-ui.success,.boost-ui.fail{animation:none}
  }

  /* ═══════════ DEV: 광고 토글 버튼 (최종 빌드 전 삭제) ═══════════ */
  #devAds{position:fixed;right:12px;bottom:14px;z-index:99;
    padding:9px 14px;border-radius:999px;
    background:rgba(11,18,38,.72);border:1px dashed rgba(255,255,255,.35);
    color:#eef2ff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #devAds.off{border-color:var(--signal-yellow);color:var(--signal-yellow)}
  /* DEV: 손맛 비교 스위치 — 광고 토글 바로 위 */
  #devFeel{position:fixed;right:12px;bottom:58px;z-index:99;
    padding:9px 14px;border-radius:999px;
    background:rgba(11,18,38,.72);border:1px dashed rgba(255,255,255,.35);
    color:#eef2ff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #devFeel.off{border-color:var(--signal-yellow);color:var(--signal-yellow)}
  body.go-open #devFeel{top:58px;bottom:auto}
  #devRabbit{position:fixed;right:12px;bottom:102px;z-index:99;
    padding:9px 14px;border-radius:999px;
    background:rgba(11,18,38,.72);border:1px dashed rgba(255,255,255,.35);
    color:#eef2ff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #devRabbit.off{border-color:var(--signal-yellow);color:var(--signal-yellow)}
  body.go-open #devRabbit{top:102px;bottom:auto}
  /* ═══════════ DEV 끝 ═══════════ */

  /* 주행 중 설정 버튼 — 누르면 일시정지 + 설정 패널. 홈·결과 화면에선 오버레이에 가려진다 */
  #gameSetBtn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:7;pointer-events:auto;
    width:38px;height:38px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;
    background:rgba(28,37,71,.7);border:1px solid #2c3766;color:var(--dim);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  #gameSetBtn svg{width:19px;height:19px}
  #gameSetBtn:active{transform:translateX(-50%) scale(.94)}

  /* ══════════ 설정 패널 (홈 리더보드 패널 스타일 공유) ══════════ */
  .setRows{margin-top:16px;display:flex;flex-direction:column;gap:18px}
  .setRow{display:grid;grid-template-columns:22px 1fr 34px;grid-template-rows:auto auto;
    column-gap:10px;row-gap:8px;align-items:center}
  .setIc{grid-row:1/3;font-size:17px;line-height:1;text-align:center}
  .setLbl{font-size:13.5px;font-weight:700;color:var(--text)}
  .setVal{grid-row:1;grid-column:3;font-size:13px;font-weight:700;color:#8fc0ff;
    text-align:right;font-variant-numeric:tabular-nums}
  .setRow input[type=range]{grid-column:2/4;width:100%;height:22px;margin:0;background:none;
    -webkit-appearance:none;appearance:none;cursor:pointer;--p:100%}
  .setRow input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--korail-blue) var(--p),rgba(255,255,255,.14) var(--p))}
  .setRow input[type=range]::-moz-range-track{height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--korail-blue) var(--p),rgba(255,255,255,.14) var(--p))}
  .setRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
    margin-top:-7px;border-radius:50%;background:#fff;border:none;box-shadow:0 1px 6px rgba(0,0,0,.45)}
  .setRow input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
    background:#fff;border:none;box-shadow:0 1px 6px rgba(0,0,0,.45)}
  .setRow input[type=range]:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:4px}
  .setResume{margin-top:20px;width:100%;background:var(--kp-primary);color:#fff;border:none;
    border-radius:12px;padding:13px 0;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .setResume:active{transform:scale(.98)}

  /* ══════════ 게임오버 결과 카드 ══════════
     토큰: 배경 #0A0E27 · 시안 #3DE0FF/#7DE8FF · 파랑 #0056D1/#3EA0FF · 보조 #91939A · 금 #FFD970
     크기는 384px 폭 기준. 세로가 짧은 기기에선 뱃지·토끼만 vh 로 줄여 버튼이 화면 밖으로 밀리지 않게 한다.
     [다시 달리기]가 엄지 닿는 하단에 오도록 카드를 아래쪽에 붙인다. */
  .overlay.goOv{justify-content:flex-end;gap:0;background:rgba(5,8,22,.45);
    backdrop-filter:none;-webkit-backdrop-filter:none;
    padding:16px 16px max(16px, env(safe-area-inset-bottom));
    font-family:'PGov',Pretendard,-apple-system,sans-serif}
  .goCard{--badge:min(140px,16vh);--rabbit:min(180px,19vh);
    width:100%;max-width:352px;flex:none;display:flex;flex-direction:column;align-items:center;
    padding:16px 16px 16px;border-radius:24px;background:rgba(13,20,48,.82);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:goIn .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes goIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .goHead{display:flex;align-items:center;gap:10px;width:100%;font-size:12.5px;font-weight:600;color:#91939A}
  .goHead::before,.goHead::after{content:'';flex:1;height:1px}
  .goHead::before{background:linear-gradient(90deg,transparent,rgba(125,232,255,.35))}
  .goHead::after{background:linear-gradient(90deg,rgba(125,232,255,.35),transparent)}
  .goScoreBlk{text-align:center}
  .goLbl{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:4px;color:#91939A;padding-left:4px}
  .goScore{font-family:Pretendard,-apple-system,'PGov',sans-serif;font-size:58px;font-weight:900;line-height:1.05;
    color:#fff;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(61,224,255,.35)}
  .goTier{margin-top:8px;display:flex;flex-direction:column;align-items:center}
  .goBadgeWrap{position:relative;width:var(--badge);height:var(--badge)}
  .goBadge{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  /* 리본 — 뱃지 이미지엔 방패만 있다. 금색 테두리 = 바깥 금색 도형 위에 2px 안쪽으로 남색 도형을 겹쳐 만든다.
     양끝은 제비꼬리(안쪽으로 파인 V) — clip-path 로 자른다. */
  .goRibbon{position:relative;z-index:1;margin-top:-16px;min-width:150px;height:32px;padding:0 30px;
    display:flex;align-items:center;justify-content:center;background:#FFD970;
    clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%,12px 50%)}
  .goRibbon::before{content:'';position:absolute;inset:2px;background:linear-gradient(#24487F,#1B3A6B);
    clip-path:polygon(0 0,100% 0,calc(100% - 11px) 50%,100% 100%,0 100%,11px 50%)}
  .goRibbon span{position:relative;font-size:14px;font-weight:700;color:#fff;letter-spacing:.3px;white-space:nowrap}
  .goRabbit{display:block;margin-top:6px;width:var(--rabbit);height:var(--rabbit);object-fit:contain}
  .goStatus{margin-top:4px;font-size:16px;font-weight:700;color:#fff;text-align:center;line-height:1.35}
  .goStatus.up{color:#FFD970}
  .goProg{width:100%;margin-top:12px}
  .goBar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
  .goBar i{display:block;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,#3DE0FF,#0056D1);transition:width .4s cubic-bezier(.2,.8,.2,1)}
  .goGoal{margin-top:7px;font-size:12.5px;font-weight:600;color:#7DE8FF;text-align:center}
  .goBest{margin-top:12px;width:100%;display:flex;align-items:center;gap:6px;
    padding:9px 9px 9px 14px;border-radius:18px;background:rgba(255,255,255,.06);font-size:13px}
  .goCrown{width:18px;height:18px;flex:none;color:#FFD970}
  .goBestK{color:#91939A}
  .goBestV{margin-left:auto;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
  .goRankBtn{margin-left:6px;border:none;border-radius:12px;padding:6px 10px;cursor:pointer;
    background:rgba(61,224,255,.12);color:#7DE8FF;font-family:inherit;font-size:12px;font-weight:700}
  .goBtns{margin-top:14px;width:100%;display:flex;gap:10px}
  .goBtns button{height:56px;border:none;border-radius:16px;display:flex;align-items:center;justify-content:center;
    gap:7px;color:#fff;font-family:inherit;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .goBtns svg{width:20px;height:20px;flex:none}
  .goHome{flex:0 0 calc(40% - 5px);background:rgba(255,255,255,.08);font-size:15px}
  .goRetry{flex:1;background:linear-gradient(135deg,#3EA0FF,#0056D1);font-size:17px;
    box-shadow:0 8px 24px rgba(0,86,209,.45)}
  .goCnt{font-size:12px;font-weight:600;opacity:.75}
  .goBtns button:active{transform:scale(.97)}
  .goBtns button:focus-visible,.goRankBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  /* 결과 화면엔 자체 [홈으로]가 있으므로 좌하단 공용 버튼은 숨긴다. DEV 광고 토글은 버튼과 겹치지 않게 위로 */
  body.go-open #backHome{display:none!important}   /* #backHome 은 인라인 display:flex 라 !important 필요 */
  body.go-open #devAds{top:14px;bottom:auto}

  /* 승급 연출(A 상태 전용, 2초 이내): 뱃지 0.6→1 튀어오름 + 방사 파티클 + 리본 뒤따라 등장 */
  .goOv.promo .goBadge{animation:goPop .7s cubic-bezier(.2,1.6,.4,1) .15s backwards}
  @keyframes goPop{0%{transform:scale(.6);opacity:0}50%{opacity:1}100%{transform:scale(1)}}
  .goOv.promo .goRibbon{animation:goIn .35s ease-out .55s backwards}
  .goBurst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
  .goBurst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;
    background:var(--c);opacity:0;animation:goSpark 1.1s cubic-bezier(.1,.7,.3,1) var(--d) forwards}
  @keyframes goSpark{
    0%{opacity:1;transform:rotate(var(--a)) translateX(12px) scale(1)}
    100%{opacity:0;transform:rotate(var(--a)) translateX(var(--r)) scale(.3)}}

  /* ══════════ 게임 종료 확인 팝업 ══════════
     토끼(rabbit_exit_sad)가 카드 윗변 위로 얼굴만 빼꼼 — 카드 배경을 ::before 로 깔고
     토끼를 그 "뒤"에 두면 윗변 아래 몸통은 카드 배경에 가려진다. */
  .exOv{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(5,8,22,.72);font-family:'PGov',Pretendard,-apple-system,sans-serif;
    animation:lbHomeIn .15s ease-out}
  .exCard{position:relative;isolation:isolate;width:100%;max-width:300px;margin-top:96px;
    padding:22px 18px 18px;overflow:visible}
  .exCard::before{content:'';position:absolute;inset:0;z-index:1;border-radius:28px;
    background:#1B2150;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .exRabbit{position:absolute;z-index:0;left:50%;top:-104px;width:170px;transform:translateX(-50%);
    pointer-events:none;-webkit-user-drag:none}
  .exBubble{position:relative;z-index:2;background:#fff;color:#1B2150;border-radius:16px;
    padding:16px 12px;text-align:center;font-size:17px;font-weight:700}
  .exBtns{position:relative;z-index:2;display:flex;gap:10px;margin-top:16px}
  .exBtns button{flex:1;height:50px;border:none;border-radius:14px;color:#fff;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700}
  .exCancel{background:rgba(255,255,255,.10)}
  .exOk{background:#F2789F}
  .exBtns button:active{transform:scale(.97)}
  .exBtns button:focus-visible{outline:3px solid #fff;outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    .goCard,.goOv.promo .goBadge,.goOv.promo .goRibbon,.exOv{animation:none}
    .goBurst{display:none}
    .goBar i{transition:none}
  }

  #controls{position:fixed;bottom:0;left:0;right:0;height:34%;display:flex;pointer-events:none;z-index:4}
  .zone{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px;opacity:.45}
  .zone span{font-size:13px;color:var(--dim);border:1px solid #2c3766;border-radius:20px;padding:8px 18px;background:rgba(11,18,38,.6)}

  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,11,24,.85);backdrop-filter:blur(6px);text-align:center;padding:24px;transition:opacity .25s;z-index:10;overflow-y:auto}
  .overlay.hidden{opacity:0;pointer-events:none}

  /* ══════════ 게임 홈 스플래시 (img/game_home.png) ══════════
     원본 941×1672. 화면 비율이 달라도 이미지 속 버튼과 히트영역이 어긋나면 안 되므로
     유동 배치 대신 이미지 전체를 한 덩어리(.splash-stage)로 스케일하고,
     버튼은 그 안에서 원본 좌표의 백분율로 고정한다. (app.css fit.js 와 같은 사고방식)
       · 가로는 항상 꽉 채운다  → 좌우가 잘려 버튼이 사라지는 일이 없다
       · 세로는 최대 1.3배까지만 넘치게 허용(73.16svh = 941/1672 × 1.3)
         → 가로로 넓은 화면에서 이미지가 과하게 커지지 않고, 잘려도 버튼(높이 36~51%)은 안전
       · 남는 여백은 같은 이미지를 블러로 깔아 메운다 */
  .overlay.splash{padding:0;gap:0;display:block;overflow:hidden;background:#050a1e;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    visibility:visible;transition:opacity .25s, visibility 0s}
  /* 전면 이미지라 opacity:0 만으로는 게임 중에도 계속 합성된다 → 페이드가 끝나면 레이어를 끈다 */
  .overlay.splash.hidden{visibility:hidden;transition:opacity .25s, visibility 0s .25s}
  .splash-blur{position:absolute;inset:0;
    background:#050a1e url('img/game_home.png') center center/cover no-repeat;
    filter:blur(30px) brightness(.5);transform:scale(1.18)}
  .splash-stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(100%, 73.16vh);
    width:min(100%, 73.16svh);
    aspect-ratio:941/1672;
    box-shadow:0 0 70px 20px #050a1e}   /* 레터박스 경계선을 흐리게 */
  .splash-stage img{display:block;width:100%;height:100%;
    -webkit-user-drag:none;user-select:none}

  /* 히트영역 — 원본 px ÷ (941, 1672).
     play  x333–609  y607–848
     lb    x104–302  y682–828   (아이콘 + LEADERBOARD 라벨)
     set   x664–814  y682–828   (아이콘 + SETTINGS 라벨) */
  .hot{position:absolute;pointer-events:auto;background:none;border:none;padding:0;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, filter .12s ease}
  .hot:active{transform:scale(.94)}
  .hot:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:12px}
  .hot-play{left:35.39%;top:36.30%;width:29.33%;height:14.41%}
  .hot-lb  {left:11.05%;top:40.79%;width:21.04%;height:8.73%}
  .hot-set {left:70.56%;top:40.79%;width:15.94%;height:8.73%}
  @media (prefers-reduced-motion: reduce){ .hot,.hot:active{transition:none;transform:none} }

  /* ══════════ 홈 리더보드 패널 ══════════ */
  .lbHome{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(4,8,22,.72);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-family:'PGov',Pretendard,-apple-system,sans-serif;
    animation:lbHomeIn .2s ease-out}
  @keyframes lbHomeIn{from{opacity:0}to{opacity:1}}
  .lbHomePanel{width:100%;max-width:320px;background:rgba(13,20,46,.92);
    border:1px solid rgba(96,150,255,.28);border-radius:20px;padding:18px 16px 16px;
    box-shadow:0 18px 60px rgba(0,0,0,.55), 0 0 40px rgba(47,107,255,.18)}
  .lbHomeHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lbHomeTitle{font-size:14px;font-weight:800;letter-spacing:3px;color:#8fc0ff}
  .lbHomeClose{background:none;border:none;color:var(--dim);font-size:16px;
    font-family:inherit;cursor:pointer;padding:4px 6px;line-height:1}
  .lbHomeSub{margin-top:4px;font-size:11.5px;color:var(--dim)}
  /* .lbList 가 뒤에서 max-height 를 다시 잡으므로 특이도를 한 단계 올린다 */
  .lbList.lbHomeList{margin-top:12px;max-height:46vh}

  #banner{position:fixed;top:20%;left:50%;transform:translate(-50%,0) scale(.85);opacity:0;background:var(--korail-blue);color:#fff;font-weight:800;font-size:21px;padding:13px 30px;border-radius:30px;pointer-events:none;transition:all .28s cubic-bezier(.2,1.4,.4,1);box-shadow:0 8px 34px rgba(47,107,255,.5);z-index:8}
  #banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
  /* 주행 중 등급 돌파 배너 — 금색 */
  #banner.tier{background:linear-gradient(135deg,#FFE58A,#F5B324);color:#3A2600;
    box-shadow:0 8px 34px rgba(245,179,36,.55)}

  /* ══════════ 리워드 광고 (app.css --primary / PGov 톤) ══════════ */
  @font-face{font-family:'PGov';src:url('fonts/pgov-regular.woff2')format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'PGov';src:url('fonts/pgov-medium.woff2')format('woff2');font-weight:500;font-display:swap;}
  @font-face{font-family:'PGov';src:url('fonts/pgov-semi_bold.woff2')format('woff2');font-weight:600;font-display:swap;}
  @font-face{font-family:'PGov';src:url('fonts/pgov-bold.woff2')format('woff2');font-weight:700;font-display:swap;}
  :root{ --kp-primary:#0156D0; --kp-card:#1D1F29; }
  .hide{display:none!important}

  /* ══════════ 리더보드 (app.css --primary / --card / PGov 톤) ══════════ */
  .lbWrap{width:100%;max-width:300px;font-family:'PGov',Pretendard,-apple-system,sans-serif;text-align:left}
  .lbStatus{text-align:center;font-size:13px;color:var(--dim);padding:10px 0}
  .lbMe{display:flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:10px}
  .lbEditBtn{background:none;border:none;color:var(--dim);font-size:14px;cursor:pointer;padding:4px;line-height:1}
  .lbEdit{display:flex;gap:6px;align-items:center;margin-bottom:10px}
  .lbEditInput{flex:1;min-width:0;background:var(--kp-card);border:1px solid #2c3766;color:var(--text);
    border-radius:10px;padding:9px 10px;font-size:13px;font-family:inherit}
  .lbReroll,.lbConfirm{flex:none;border:none;border-radius:10px;padding:9px 12px;font-size:12px;
    font-weight:700;font-family:inherit;cursor:pointer}
  .lbReroll{background:var(--kp-card);border:1px solid #2c3766;color:var(--text)}
  .lbConfirm{background:var(--kp-primary);color:#fff}
  .lbList{background:var(--kp-card);border:1px solid #2c3766;border-radius:14px;padding:6px 4px;max-height:210px;overflow-y:auto}
  .lbRow{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12.5px;border-radius:8px}
  .lbRow.me{background:rgba(1,86,208,.24)}
  .lbRank{width:20px;flex:none;color:var(--dim);font-weight:700;text-align:center}
  .lbNick{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .lbKm{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
  .lbSpd{flex:none;width:60px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px}
  .lbMyRank{margin-top:8px;text-align:center;font-size:12px;color:var(--dim)}
  .lbEmpty{padding:16px;text-align:center;font-size:12px;color:var(--dim)}

  .ad-overlay{position:fixed;inset:0;z-index:50;background:#05070f;display:flex;flex-direction:column;
    font-family:'PGov',Pretendard,-apple-system,sans-serif}
  .ad-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
    padding:14px;gap:8px}
  .ad-mute,.ad-close{background:rgba(11,18,38,.72);border:1px solid rgba(255,255,255,.18);
    color:#eef2ff;border-radius:20px;font-family:inherit;font-weight:600;cursor:pointer}
  .ad-mute{padding:8px 14px;font-size:12px}
  .ad-close{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;padding:0;flex:none}
  .ad-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
  #ytHost{width:100%;max-width:420px;height:100%;margin:0 auto}
  .ad-progress{height:3px;background:rgba(255,255,255,.14);flex:none}
  .ad-progress-fill{height:100%;width:0%;background:var(--kp-primary);transition:width .2s linear}

  /* 15초 보상 토스트 + 계속보기/돌아가기 버튼 (영상 재생 중 오버레이) */
  .ad-toast{position:absolute;top:50%;left:50%;z-index:4;transform:translate(-50%,-50%);
    background:rgba(5,7,15,.92);color:#fff;font-weight:700;font-size:14px;
    padding:12px 22px;border-radius:30px;pointer-events:none;white-space:nowrap;
    animation:adToastPop .25s ease-out}
  @keyframes adToastPop{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .ad-skip{position:absolute;left:0;right:0;bottom:18px;z-index:4;display:flex;gap:10px;justify-content:center;padding:0 18px;
    opacity:0;pointer-events:none;transition:opacity .15s ease}
  .ad-skip.show{opacity:1;pointer-events:auto}

  /* 광고 15초 경과 후 계속보기/돌아가기 버튼과 좌하단 홈으로 버튼이 겹치지 않도록,
     한쪽이 나타날 때 다른 쪽은 페이드아웃 */
  #backHome{transition:opacity .15s ease}
  #backHome.away{opacity:0;pointer-events:none}
  .ad-skip button{flex:1;max-width:180px;font-family:inherit;font-size:13px;font-weight:700;
    border-radius:12px;padding:12px 16px;cursor:pointer}
  #adSkipContinueBtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#eef2ff}
  #adSkipReturnBtn{background:var(--kp-primary);border:none;color:#fff}

  .ad-done,.ad-confirm{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:rgba(5,7,15,.94);text-align:center;padding:28px}
  .ad-done-badge{font-size:19px;font-weight:700;color:#fff}
  .ad-cta{background:var(--kp-primary);color:#fff;font-weight:700;font-size:15px;
    text-decoration:none;border-radius:14px;padding:14px 28px}
  .ad-return{background:transparent;border:1px solid rgba(255,255,255,.3);color:#eef2ff;
    font-family:inherit;font-size:14px;font-weight:600;border-radius:14px;padding:12px 26px;cursor:pointer}
  .ad-confirm p{font-size:15px;color:#eef2ff;max-width:260px;line-height:1.6;font-weight:500}
  .ad-confirm-btns{display:flex;gap:10px}
  .ad-confirm-btns button{font-family:inherit;font-size:13px;font-weight:700;
    border-radius:12px;padding:11px 18px;cursor:pointer;border:none}
  #adConfirmStay{background:var(--kp-primary);color:#fff}
  #adConfirmLeave{background:transparent;border:1px solid rgba(255,255,255,.3);color:#eef2ff}

  /* ── 페이지 전환 애니메이션 (transition.js 가 body 에 토글) ── */
  .fade-leave{opacity:0;transition:opacity .15s ease}
  .fade-enter{opacity:0}
  .fade-enter-active{opacity:1;transition:opacity .15s ease}

  @media (prefers-reduced-motion: reduce){
    .fade-leave,.fade-enter,.fade-enter-active{transition:none}
  }
</style>
</head>
<body>
<script src="transition.js"></script>

<div id="bgArt" aria-hidden="true"></div>
<!-- 3중 캔버스: 속도선 → 침목(부스터 중 blur 대상) → 레일/기차/파티클 -->
<canvas id="cvBg"></canvas>
<canvas id="cvTies"></canvas>
<canvas id="cv"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="meteors" aria-hidden="true"></div>
<div id="gaugebar"></div>
<button id="gameSetBtn" type="button" aria-label="일시정지 및 설정">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>
<!-- DEV: 광고 토글 버튼 (최종 빌드 전 삭제) -->
<button id="devAds" type="button">광고 ON</button>
<!-- DEV: 손맛 비교 스위치 (최종 빌드 전 삭제) -->
<button id="devFeel" type="button">손맛 ON</button>
<button id="devRabbit" type="button">토끼 ON</button>

<div id="hud">
  <div>
    <div class="km" id="kmWrap"><span id="km">0.0</span><small>km</small></div>
    <div class="next">다음 역 <b id="nextSt">광명</b> <span id="nextDist"></span></div>
    <div id="combo"></div>
  </div>
  <div class="boost-ui" id="boostUI" aria-hidden="true">
    <div class="boost-ring">
      <svg viewBox="0 0 48 48">
        <circle class="ring-track" cx="24" cy="24" r="20"></circle>
        <circle class="ring-prog" id="boostRing" cx="24" cy="24" r="20"></circle>
      </svg>
      <span class="boost-num" id="boostNum">0</span>
    </div>
    <div class="boost-bar"><i id="boostFill"></i></div>
    <div class="boost-lbl" id="boostLbl">부스터</div>
  </div>
</div>

<div id="banner"></div>

<div id="controls">
  <div class="zone"><span>◀ 왼쪽</span></div>
  <div class="zone"><span>오른쪽 ▶</span></div>
</div>

<!-- 게임 홈: asset/game_home.png 를 그대로 깔고, 이미지 속 버튼 위에 투명 히트영역을 올린다.
     좌표는 원본 941×1672 px 기준 비율(%)이라 어떤 화면 크기에서도 버튼과 정확히 겹친다. -->
<div class="overlay splash" id="startOv">
  <div class="splash-blur" aria-hidden="true"></div>
  <div class="splash-stage">
    <img src="img/game_home.png" alt="레일런 — RUN BEYOND THE SKY" draggable="false">
    <button class="hot hot-play" id="startBtn" type="button" aria-label="게임 시작"></button>
    <button class="hot hot-lb" id="lbOpenBtn" type="button" aria-label="리더보드"></button>
    <button class="hot hot-set" id="settingsBtn" type="button" aria-label="설정"></button>
  </div>
</div>

<!-- 홈에서 여는 리더보드(상위 20위). 게임오버 화면의 리더보드와 스타일을 공유한다. -->
<div class="lbHome hide" id="lbHomeOv" role="dialog" aria-modal="true" aria-label="리더보드">
  <div class="lbHomePanel">
    <div class="lbHomeHead">
      <span class="lbHomeTitle">LEADERBOARD</span>
      <button class="lbHomeClose" id="lbHomeCloseBtn" type="button" aria-label="닫기">✕</button>
    </div>
    <p class="lbHomeSub">최고 운행 거리 상위 20위</p>
    <div class="lbList lbHomeList" id="lbHomeList"></div>
  </div>
</div>

<!-- 설정: 홈(⚙ SETTINGS)과 주행 중(상단 ⚙)에서 같은 패널을 연다. 주행 중엔 일시정지 상태로 열린다. -->
<div class="lbHome hide" id="setOv" role="dialog" aria-modal="true" aria-label="설정">
  <div class="lbHomePanel">
    <div class="lbHomeHead">
      <span class="lbHomeTitle" id="setTitle">SETTINGS</span>
      <button class="lbHomeClose" id="setCloseBtn" type="button" aria-label="닫기">✕</button>
    </div>
    <p class="lbHomeSub" id="setSub">소리 크기를 조절할 수 있어요</p>
    <div class="setRows">
      <div class="setRow">
        <span class="setIc" aria-hidden="true">🎵</span>
        <label class="setLbl" for="volMusic">배경음악</label>
        <input type="range" id="volMusic" min="0" max="100" step="1">
        <span class="setVal" id="volMusicVal">100</span>
      </div>
      <div class="setRow">
        <span class="setIc" aria-hidden="true">🔔</span>
        <label class="setLbl" for="volSfx">효과음</label>
        <input type="range" id="volSfx" min="0" max="100" step="1">
        <span class="setVal" id="volSfxVal">100</span>
      </div>
    </div>
    <button class="setResume hide" id="setResumeBtn" type="button">계속 운행</button>
  </div>
</div>

<!-- ═══ 게임오버 결과 카드 — showGameOver(score) 가 채운다 ═══ -->
<div class="overlay hidden goOv" id="overOv">
  <div class="goCard" id="goCard" role="dialog" aria-modal="true" aria-labelledby="goHead">
    <div class="goHead" id="goHead">게임 결과</div>
    <div class="goScoreBlk" id="goScoreBlk">
      <div class="goLbl">SCORE</div>
      <div class="goScore" id="goScore">0</div>
    </div>
    <div class="goTier">
      <div class="goBadgeWrap">
        <img class="goBadge" id="goBadge" alt="" draggable="false">
        <div class="goBurst" id="goBurst" aria-hidden="true"></div>
      </div>
      <div class="goRibbon"><span id="goTierName">견습 기관사</span></div>
    </div>
    <img class="goRabbit" id="goRabbit" alt="" draggable="false">
    <p class="goStatus" id="goStatus"></p>
    <div class="goProg">
      <div class="goBar"><i id="goBarFill"></i></div>
      <p class="goGoal" id="goGoal"></p>
    </div>
    <div class="goBest">
      <svg class="goCrown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z" fill="currentColor"/></svg>
      <span class="goBestK">최고 기록</span>
      <b class="goBestV" id="goBestV">0</b>
      <button class="goRankBtn" id="goRankBtn" type="button">순위 <span aria-hidden="true">›</span></button>
    </div>

/* ══════════ 사운드 (audio/audio.js — RRAudio) ══════════
   BGM·효과음은 파일 기반 Web Audio. 음소거 상태는 audio.js 가 localStorage 에 저장한다.
   iOS 는 사용자 제스처 안에서 unlock() 해야 소리가 난다 → 아래 unlockAudio 를
   pointerdown/pointerup/keydown 캡처 단계에 걸어 어떤 탭이든 첫 입력에서 풀리게 한다.
   (터치에선 pointerdown 이 활성화 제스처로 인정되지 않는 브라우저가 있어 pointerup 도 건다) */
RRAudio.preload();
let musicHoldUntil = 0, lastIntensityT = 0;   // 페이드·덕킹 중엔 setIntensity 로 덮어쓰지 않는다
function bgm(fade){
  RRAudio.playBgm(fade);
  musicHoldUntil = performance.now() + (fade==null ? 1.2 : fade)*1000 + 100;
}
function unlockAudio(){
  // unlock() 은 제스처 안에서 즉시 resume() 을 호출한다. 반환 promise 는 음원 로드 완료라
  // 게임 시작을 막지 않도록 await 하지 않고, 로드가 끝난 뒤 필요한 BGM 만 켠다.
  RRAudio.unlock().then(()=>{
    if(playing || !$('startOv').classList.contains('hidden')) bgm();   // 홈·주행 중에만
  });
}
for(const ev of ['pointerdown','pointerup','keydown']) addEventListener(ev, unlockAudio, true);
// 탭이 가려지면 소리도 멈춘다 (모바일에서 백그라운드 재생 방지)
document.addEventListener('visibilitychange', ()=>{
  const c = RRAudio.ctx; if(!c) return;
  if(document.visibilityState === 'hidden') c.suspend(); else c.resume();
});

/* ══════════ 기관사 등급 (게임오버 결과 화면) ══════════

const kmNow = ()=> pos*KM_PER_STEP + bonusKm;

function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  for(const [c,x] of [[bgCv,bgCtx],[tieCv,tieCtx],[cv,ctx]]){
    c.width = W*DPR; c.height = H*DPR;
    x.setTransform(DPR,0,0,DPR,0,0);
  }
}
addEventListener('resize', resize); resize();

/* ══════════ 선로 ══════════ */
function genSteps(){
  steps=[{x:0,y:0,dir:Math.random()<.5?-1:1}];
  for(let i=0;i<60;i++) pushStep();
}
function pushStep(){
  const p = steps[steps.length-1];
  let dir = p.dir, run = 0;
  for(let i=steps.length-1;i>=0 && steps[i].dir===p.dir;i--) run++;
  if(run>=4 || Math.random()<.4) dir = -p.dir;
  steps.push({x:p.x+p.dir, y:p.y+1, dir});
}

/* ══════════ 입력 ══════════ */
function tap(dir){
  if(!playing || paused) return;
  if(dir === steps[pos].dir){
    pos++;
    if(steps.length-pos < 40) pushStep();
    const now = performance.now();
    combo = (now - lastTapT < 620) ? combo+1 : 1;
    lastTapT = now;
    gauge = Math.min(100, gauge + 9 + Math.min(7, combo*0.5));   // 생존 게이지(기존 로직 유지)
    if(boosting) bonusKm += KM_PER_STEP * (BOOST_SCORE_MULT - 1);  // 점수 배율
    registerChargeTap(now);                                        // 부스터 챌린지 집계
    speed = Math.min(320, speed + 26);
    maxSpeed = Math.max(maxSpeed, speed);

    tilt = -steps[pos-1].dir * 0.22;
    // 입력 피드백은 기울기·스파크·사운드로. 화면 흔들림은 충돌 전용이라 여기선 쓰지 않는다
    // (연타 중 계속 흔들리면 부스터 충전 구간 내내 화면이 떨려 멀미를 유발함)
    spawnSparks();
    if(feelOn()){
      // 충전 중엔 멜로디 n번째 음(12번째 = 부스터 발동과 동시에 높은 도), 부스터 중엔 윗음 순환,
      // 쿨다운 중엔 기본음
      if(lastChargeIdx >= 0) playNote(COMBO_MELODY[Math.min(lastChargeIdx, COMBO_MELODY.length-1)], dir);
      else if(boosting)      playNote(FEVER_MELODY[feverNoteI++ % FEVER_MELODY.length], dir);
      else                   playNote(dir < 0 ? 0 : 5, dir);
    } else {
      RRAudio.sfx(dir < 0 ? 'switch_L' : 'switch_R');   // 좌 G4 · 우 C5 — 엮으면 선율이 된다
    }
    checkMilestone(); updateHUD();
  } else {
    if(inBoostGrace()) return;   // 부스터 발동 직후 그레이스 타임: 충돌 판정 무시
    derail();
  }
}

/* ══════════ 부스터 ══════════ */
const nowMs = ()=> performance.now();
function inBoostGrace(){ return boosting && nowMs() < boostStart + BOOST_GRACE_MS; }
function onCooldown(){ return nowMs() < cooldownEnd; }
function easeInOutCubic(p){ return p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2; }

// 시간 창 안에 목표 입력수를 채우면 발동. 부스터 중·쿨다운 중엔 충전되지 않는다.
function registerChargeTap(now){
  lastChargeIdx = -1;
  if(boosting || onCooldown()){ chargeTaps = 0; return; }
  if(chargeTaps === 0 || now - chargeStart > BOOST_WINDOW_MS){
    if(chargeTaps > 0) failCharge();      // 직전 창을 못 채운 채 넘겼으면 실패 처리
    chargeStart = now; chargeTaps = 1;
  } else {
    chargeTaps++;
  }
  // 연타할수록 한 칸씩 올라가는 음 — 게이지를 귀로 읽게.
  // 손맛 ON: 선로 전환음 자체가 멜로디가 된다(tap() 에서 재생) / OFF: 예전 충전음 음계
  if(feelOn()) lastChargeIdx = chargeTaps - 1;
  else RRAudio.tap(chargeTaps - 1);
  if(chargeTaps >= BOOST_NEED_TAPS) startBoost(now);
}
// 콤보 멜로디 한 음 — G4 반음 수를 가까운 샘플의 재생 속도로 바꿔 낸다.
// 높아질수록 날카롭게 들리므로 음량을 조금씩 낮추고, 좌/우는 스테레오 위치로 구분한다.
function playNote(semi, dir){
  const useR = semi >= 5;
  const rate = Math.pow(2, (useR ? semi-5 : semi) / 12);
  RRAudio.sfx(useR ? 'switch_R' : 'switch_L', {
    rate, pan: dir * NOTE_PAN,
    gain: RRAudio.VOL.switch * (1 - .25 * Math.min(1, semi/17)),
  });
}
function failCharge(){
  chargeTaps = 0;
  const ui = $('boostUI');                // 화면 전체가 아니라 게이지 UI 만 살짝 흔든다
  ui.classList.remove('fail'); void ui.offsetWidth; ui.classList.add('fail');
  setTimeout(()=> ui.classList.remove('fail'), 240);
}
function setSpeedMultTarget(target, now){
  rampFrom = speedMult; rampTo = target; rampStart = now;
}
function startBoost(now){
  chargeTaps = 0;
  boosting = true; boostStart = now; boostEnd = now + BOOST_DURATION_MS;
  setSpeedMultTarget(BOOST_SPEED_MULT, now);   // 즉시 전환 X — 보간으로 서서히
  const ui = $('boostUI');
  ui.classList.add('boosting');
  ui.classList.remove('success'); void ui.offsetWidth; ui.classList.add('success');
  setTimeout(()=> ui.classList.remove('success'), 600);
  if(!reduceMotion) $('bgArt').classList.add('boost');   // 배경 미세 줌(별 패럴랙스 대체)
  $('vignette').classList.add('on');                // 비네트(모션 아님 → 항상 적용)
  RRAudio.boost(true);
}
function endBoost(){
  boosting = false;
  if(playing) RRAudio.boost(false);       // 탈선 뒤(결과 화면)엔 종료음을 내지 않는다
  cooldownEnd = nowMs() + BOOST_COOLDOWN_MS;
  setSpeedMultTarget(1, nowMs());
  $('boostUI').classList.remove('boosting');
  $('bgArt').classList.remove('boost');
  $('vignette').classList.remove('on');
}
function resetBoost(){
  chargeTaps=0; chargeStart=0; boosting=false;
  boostStart=0; boostEnd=0; cooldownEnd=0;
  speedMult=1; rampFrom=1; rampTo=1; rampStart=0;
  bonusKm=0; streaks=[];
  $('bgArt').classList.remove('boost');
  $('vignette').classList.remove('on');
  $('boostUI').classList.remove('boosting','cooldown','success','fail');
}

// 소실점 기준 방사형 스피드라인. speed/길이에 랜덤 편차를 줘서 반복 주기가
// 눈에 띄지 않게(= 스트로보 패턴이 생기지 않게) 한다.
function spawnStreak(){
  return {
    ang: Math.random()*Math.PI*2,
    r:   40 + Math.random()*90,
    spd: 260 + Math.random()*420,
    len: 50 + Math.random()*90,
    life: 1,
    fade: .5 + Math.random()*.6,
    col: Math.random()<.4 ? '#ffffff' : '#7DD3FC'
  };
}
function updateStreaks(dt){
  const want = (boosting && !reduceMotion) ? BOOST_STREAKS : 0;
  while(streaks.length < want) streaks.push(spawnStreak());
  const maxR = Math.hypot(W,H);
  for(let i=streaks.length-1;i>=0;i--){
    const s = streaks[i];
    s.r += s.spd*dt*speedMult;
    s.life -= dt*s.fade;
    if(s.life<=0 || s.r>maxR){
      if(want) streaks[i] = spawnStreak(); else streaks.splice(i,1);
    }
  }
}
function drawStreaks(){
  if(!streaks.length) return;
  const vpx = W/2, vpy = H*.30;
  ctx.save(); ctx.lineCap='round'; ctx.lineWidth=1.6;
  ctx.shadowColor='#38BDF8'; ctx.shadowBlur=6;
  for(const s of streaks){
    const cos=Math.cos(s.ang), sin=Math.sin(s.ang);
    ctx.globalAlpha = Math.sin(Math.max(0,Math.min(1,s.life))*Math.PI) * .55;  // 0→1→0
    ctx.strokeStyle = s.col;
    ctx.beginPath();
    ctx.moveTo(vpx+cos*s.r, vpy+sin*s.r);
    ctx.lineTo(vpx+cos*(s.r+s.len), vpy+sin*(s.r+s.len));
    ctx.stroke();
  }
  ctx.restore();
}

let lastBoostNum='', lastBoostLbl='';
function updateBoostUI(now){
  const ui=$('boostUI'), ring=$('boostRing'), fill=$('boostFill');
  let ringP=0, fillP=0, num='0', lbl='부스터', cooling=false;
  if(boosting){
    ringP = Math.max(0,(boostEnd-now)/BOOST_DURATION_MS);
    fillP = 1; num='⚡'; lbl='부스터!';
  } else if(onCooldown()){
    cooling = true;
    fillP = Math.max(0,(cooldownEnd-now)/BOOST_COOLDOWN_MS);   // 남은 쿨다운이 줄어듦
    num = String(Math.ceil((cooldownEnd-now)/1000)); lbl='충전 중';
  } else if(chargeTaps>0){
    ringP = Math.max(0, 1-(now-chargeStart)/BOOST_WINDOW_MS);  // 3초 카운트다운
    fillP = Math.min(1, chargeTaps/BOOST_NEED_TAPS);
    num = String(chargeTaps);
  }
  ui.classList.toggle('cooldown', cooling);
  ring.style.strokeDashoffset = RING_C*(1-ringP);   // dasharray 는 CSS 에 고정
  fill.style.width = (fillP*100)+'%';
  if(num!==lastBoostNum){ $('boostNum').textContent = num; lastBoostNum = num; }
  if(lbl!==lastBoostLbl){ $('boostLbl').textContent = lbl; lastBoostLbl = lbl; }
}
addEventListener('pointerdown', e=>{
  // 설정 버튼·패널, 좌하단 홈으로 버튼 조작이 열차 이동으로 새지 않게
  if(e.target.closest('#gameSetBtn, #setOv, #backHome')) return;

});
addEventListener('keydown', e=>{

  if(e.key==='ArrowRight') tap(1);
});

/* ══════════ 일시정지 ══════════
   부스터·쿨다운·충전 창·콤보는 performance.now() 절대 시각으로 관리되므로,
   재개할 때 멈춰 있던 시간만큼 전부 뒤로 민다(안 그러면 정지 중에 부스터가 끝나 버림). */
let paused = false, pauseAt = 0;
function pauseGame(){
  if(!playing || paused) return;
  paused = true; pauseAt = performance.now();
}
function resumeGame(){
  if(!paused) return;
  const d = performance.now() - pauseAt;
  boostStart += d; boostEnd += d; cooldownEnd += d;
  chargeStart += d; rampStart += d; lastTapT += d;
  musicHoldUntil += d;
  paused = false;
}

/* ══════════ 설정 패널 ══════════ */
const volEls = { music: $('volMusic'), sfx: $('volSfx') };
function renderVol(el, v){
  const n = Math.round(v*100);
  el.value = n;
  el.style.setProperty('--p', n+'%');
  $(el.id+'Val').textContent = n;
}
function openSettings(){
  renderVol(volEls.music, RRAudio.musicVolume);
  renderVol(volEls.sfx, RRAudio.sfxVolume);
  const inGame = playing;
  if(inGame) pauseGame();
  $('setTitle').textContent = inGame ? 'PAUSED' : 'SETTINGS';
  $('setSub').textContent = inGame ? '일시정지 중 · 소리 크기를 조절할 수 있어요' : '소리 크기를 조절할 수 있어요';
  $('setResumeBtn').classList.toggle('hide', !inGame);
  $('setOv').classList.remove('hide');
}
function closeSettings(){
  if($('setOv').classList.contains('hide')) return;
  $('setOv').classList.add('hide');
  RRAudio.sfx('ui_back');
  resumeGame();
}
$('gameSetBtn').addEventListener('click', ()=>{ RRAudio.sfx('ui_tap'); openSettings(); });
$('settingsBtn').addEventListener('click', openSettings);   // 홈 ⚙ (ui_tap 은 UI_SFX 에서)
$('setCloseBtn').addEventListener('click', closeSettings);
$('setResumeBtn').addEventListener('click', closeSettings);
// 바깥(딤) 탭으로 닫기는 홈에서만. 주행 중엔 연타하던 손가락이 스쳐 준비 없이 재개되지 않도록
// [계속 운행]·✕ 로만 재개한다.

volEls.sfx.addEventListener('input', ()=>{

// 앱 전환·화면 꺼짐으로 탭이 가려지면 주행을 자동으로 일시정지(돌아왔을 때 이미 탈선해 있지 않게)

  if(document.visibilityState === 'hidden' && playing && !paused) openSettings();
});

/* ══════════ 파티클 ══════════ */
function spawnSparks(){
  for(let i=0;i<7;i++){
    sparks.push({
      x:trainX, y:trainY-6,
      vx:(Math.random()-.5)*3.4,
      vy:Math.random()*2.2+.6,
      life:1, r:Math.random()*2+1,
      c: Math.random()<.35 ? '#ffd166' : '#8fa3c8'
    });
  }
}
function spawnRing(){ rings.push({r:20, life:1}); }

/* ══════════ 진행/종료 ══════════ */
let bannerTO;
function checkMilestone(){
  const km = kmNow();
  for(const [n,d] of STATIONS){
    if(d>0 && lastMilestone<d && km>=d){
      lastMilestone = d;
      showBanner(`${n}역 통과!`);
      stationSound(); spawnRing(); hitStop();   // 역 통과 연출은 링+차임+순간 멈춤. 흔들림은 충돌 전용
    }
  }
  if(km>=417 && km-lastMilestone>=100){
    lastMilestone = km;
    showBanner(`누적 ${Math.floor(km)}km 돌파!`);
    stationSound(); spawnRing(); hitStop();
  }
  checkTierUp(km);
}
// 주행 중 등급 돌파 — 최고점수로 정해진 지금 등급보다 높은 컷을 이번 판에 넘는 순간.
// 결과 화면의 승급 연출보다 먼저, 가장 신날 때 보상이 온다.
function checkTierUp(km){
  const idx = tierIndexOf(scoreOfKm(km));
  if(idx <= runTierIdx) return;
  runTierIdx = idx;
  showBanner(`${TIERS[idx].name} 달성!`, 'tier');
  rabbitCheer();
  RRAudio.sfx('record');
  RRAudio.duck(0.4, 0.1, 1.0);
  musicHoldUntil = performance.now() + 1200;
  spawnRing(); hitStop();
}
// 순간 멈춤 — 화면 시계(vClock)만 잠깐 세운다. 연타 중이라 입력·게이지·판정까지 멈추면
// 탭이 씹힌 것처럼 느껴지므로 그쪽은 실제 시계로 계속 돈다.
function hitStop(){
  if(!feelOn()) return;
  freezeUntil = performance.now() + HITSTOP_MS;
}
function stationSound(){
  rabbitCheer();                           // 기관사 토끼 만세
  RRAudio.sfx('station');
  RRAudio.duck(0.45, 0.1, 0.8);            // 차임이 묻히지 않게 음악을 살짝 눌렀다 복구
  musicHoldUntil = performance.now() + 1000;
}
function showBanner(t, kind){
  const b=$('banner'); b.textContent=t; b.classList.add('show');
  b.classList.toggle('tier', kind === 'tier');
  clearTimeout(bannerTO); bannerTO=setTimeout(()=>b.classList.remove('show'), kind === 'tier' ? 1800 : 1400);
}

/* ══════════ 게임오버 결과 카드 ══════════ */
const scoreOfKm = km => Math.round(km * SCORE_PER_KM);
const fmtScore  = n  => Math.round(n).toLocaleString('ko-KR');
function tierIndexOf(score){               // 역순으로 돌며 score >= cut 인 첫 등급
  for(let i=TIERS.length-1; i>=0; i--) if(score >= TIERS[i].cut) return i;
  return 0;
}
const tierOf = score => TIERS[tierIndexOf(score)];
function getBestScore(){
  try{ return Math.max(0, parseInt(localStorage.getItem(BEST_SCORE_KEY)||'0',10) || 0); }catch(e){ return 0; }
}
function setBestScore(n){ try{ localStorage.setItem(BEST_SCORE_KEY, String(n)); }catch(e){} }
const goVisible = ()=> !$('overOv').classList.contains('hidden');

// 등급 뱃지·리본·게이지·최고기록 pill. goalText 는 상태별로 호출부가 정한다.
function renderTier(tierIdx, best, goalText){
  const tier = TIERS[tierIdx], next = TIERS[tierIdx+1];
  $('goBadge').src = tier.badge;
  $('goBadge').alt = tier.name + ' 뱃지';
  $('goTierName').textContent = tier.name;
  const pct = next ? Math.min(1, Math.max(0, (best - tier.cut) / (next.cut - tier.cut))) : 1;
  const fill = $('goBarFill');
  fill.style.transition = 'none'; fill.style.width = '0%';
  void fill.offsetWidth; fill.style.transition = '';
  fill.style.width = (pct*100).toFixed(1) + '%';
  $('goGoal').textContent = goalText;
  $('goBestV').textContent = fmtScore(best);
}
// "아직 멀었다"는 인상을 주지 않는 목표 문구 — 다음 등급이 멀면 최고기록을 중간 목표로 제시
function goalTextFor(tierIdx, best, score){
  const next = TIERS[tierIdx+1];
  if(!next) return '최고 등급 달성! 이제 기록에 도전하세요';
  const remain = next.cut - best;
  if(best === 0 || remain <= best * NEAR_GOAL_RATIO) return `${next.name}까지 ${fmtScore(remain)}점!`;
  const gap = best - score;
  return gap > 0 ? `최고 기록 갱신까지 ${fmtScore(gap)}점` : '지금이 최고 기록! 다음 판도 이 기세로';
}
function openGameOverCard(){
  const ov = $('overOv');
  // 애니메이션을 매번 처음부터 — 클래스·노드를 다시 붙여 재생시킨다
  const card = $('goCard'); card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  ov.classList.remove('hidden');
  document.body.classList.add('go-open');
  refreshGameOverButtons();
  armBackGuard();
}

function showGameOver(score){
  const prevBest    = getBestScore();
  const prevTierIdx = tierIndexOf(prevBest);
  const isNewBest   = score > prevBest;
  const newBest     = Math.max(score, prevBest);
  const newTierIdx  = tierIndexOf(newBest);
  const promoted    = newTierIdx > prevTierIdx;
  setBestScore(newBest);

  // 상태: A 승급 > B 신기록 > D 초반 사망 > C 아깝다 (C·D 사이 구간은 C — 즉 CLOSE_CALL_RATIO 미만도 C)
  const state = promoted ? 'promo'
    : isNewBest ? 'best'
    : (prevBest === 0 || score < prevBest * EARLY_DEATH_RATIO) ? 'early'
    : 'close';
  const tier = TIERS[newTierIdx];
  const status = {
    promo: `${tier.name}로 승급했어요!`,
    best:  '최고 기록 갱신!',
    close: prevBest - score > 0 ? `아깝다! 최고 기록까지 ${fmtScore(prevBest - score)}점` : '최고 기록과 동점이에요!',
    early: '이번엔 출발이 아쉬웠어요. 한 번 더!',
  }[state];

  $('goScoreBlk').classList.remove('hide');
  $('goScore').textContent = fmtScore(score);
  $('goRabbit').src = state === 'early' ? RABBIT_SAD : tier.rabbit;
  $('goStatus').textContent = status;
  $('goStatus').classList.toggle('up', state === 'promo' || state === 'best');
  renderTier(newTierIdx, newBest, goalTextFor(newTierIdx, newBest, score));

  const ov = $('overOv');
  ov.classList.remove('promo'); void ov.offsetWidth;
  ov.classList.toggle('promo', state === 'promo');
  $('goBurst').innerHTML = '';
  if(state === 'promo' && !reduceMotion) spawnPromoBurst();
  if((state === 'promo' || state === 'best') && prevBest > 0) RRAudio.sfx('record');
  openGameOverCard();
}
// 기회가 0인 채로 페이지에 들어온 경우 — 이번 판 점수 없이 현재 등급과 광고 버튼만 보여준다
function showGameOverIdle(){
  const best = getBestScore(), idx = tierIndexOf(best), next = TIERS[idx+1];
  $('goScoreBlk').classList.add('hide');
  $('goRabbit').src = TIERS[idx].rabbit;
  $('goStatus').textContent = '오늘의 기회를 다 썼어요. 영상 보고 이어서 달려요!';
  $('goStatus').classList.remove('up');
  $('overOv').classList.remove('promo');
  renderTier(idx, best, next ? `${next.name}까지 ${fmtScore(next.cut - best)}점` : '최고 등급 달성! 이제 기록에 도전하세요');
  openGameOverCard();
}
// 승급 파티클 — 금·시안 점들이 뱃지 중심에서 방사 (1.1s + 최대 지연 .25s → 2초 이내)
function spawnPromoBurst(){
  const box = $('goBurst'), n = 16, cols = ['#FFD970','#7DE8FF','#3DE0FF','#ffffff'];
  for(let i=0;i<n;i++){
    const s = document.createElement('i');
    s.style.setProperty('--a', (i/n*360 + Math.random()*12) + 'deg');
    s.style.setProperty('--r', (70 + Math.random()*40) + 'px');
    s.style.setProperty('--d', (.2 + Math.random()*.05) + 's');
    s.style.setProperty('--c', cols[i % cols.length]);
    box.appendChild(s);
  }
}

// 최초 진입("운행 시작")도 재도전과 동일하게 기회 1개를 소모한다.
// 그래야 새로고침/뒤로가기로 startOv 를 다시 띄워도 기회 카운트를 우회할 수 없다.

document.addEventListener('click', e=>{

/* 키보드 — ESC: 팝업 취소 / 스페이스·엔터: 결과 화면에서 다시 달리기(재도전 마찰 최소화) */

  if(e.target.closest && e.target.closest('button, input, a, textarea')) return;
  e.preventDefault();
  const btn = $('retryBtn').classList.contains('hide') ? $('adWatchBtn') : $('retryBtn');
  btn.click();
});

/* YouTube IFrame API 지연 로드 */
let ytApiReady = false, ytApiWaiters = [];
(function loadYT(){
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
window.onYouTubeIframeAPIReady = function(){
  ytApiReady = true;
  ytApiWaiters.forEach(fn=>fn()); ytApiWaiters=[];
};
function whenYTReady(fn){ ytApiReady ? fn() : ytApiWaiters.push(fn); }

let ytPlayer=null, currentAd=null, adMuted=true, adRetryCount=0;
let watch = { accumulated:0, duration:0, ended:false, paused:true, rewarded:false, timerId:null };

function openAdOverlay(){
  RRAudio.suspendForAd();                 // 광고엔 자체 소리가 있으므로 게임 소리는 완전히 끈다
  adRetryCount = 0;
  $('adConfirm').classList.add('hide');
  $('adFail').classList.add('hide');
  $('adOverlay').classList.remove('hide');
  startAdAttempt(pickAd());
}
function startAdAttempt(ad){
  currentAd = ad;
  clearInterval(watch.timerId);
  try{ ytPlayer && ytPlayer.destroy && ytPlayer.destroy(); }catch(e){}
  ytPlayer = null;
  watch = { accumulated:0, duration:0, ended:false, paused:true, rewarded:false, timerId:null };
  adMuted = true;
  $('adMuteBtn').textContent = '🔇 소리 켜기';
  $('adProgressFill').style.width = '0%';
  $('adDone').classList.add('hide');
  $('adFail').classList.add('hide');
  $('adToast').classList.add('hide');
  setAdSkipVisible(false);
  $('adStage').classList.remove('hide');
  whenYTReady(()=>createPlayer(currentAd));
  watch.timerId = setInterval(()=>{
    if(document.visibilityState==='visible' && !watch.paused && !watch.ended){
      watch.accumulated += 0.25;
      if(watch.duration>0) $('adProgressFill').style.width = Math.min(100, watch.accumulated/watch.duration*100)+'%';
      // 15초 이상 영상: 누적 시청시간이 15초에 도달하는 순간 즉시 지급 (영상은 계속 재생)
      if(!watch.rewarded && watch.duration>=15 && watch.accumulated>=15) grantRewardMidPlay();
    }
  }, 250);
}
function createPlayer(ad){
  let host = document.getElementById('ytHost');
  if(!host){
    host = document.createElement('div'); host.id='ytHost';
    $('adStage').appendChild(host);
  }
  ytPlayer = new YT.Player('ytHost', {
    videoId: ad.id, width:'100%', height:'100%',
    playerVars:{ autoplay:1, mute:1, controls:0, disablekb:1, rel:0, playsinline:1, modestbranding:1 },
    events:{
      onReady(){ try{ ytPlayer.mute(); ytPlayer.playVideo(); }catch(e){} },
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}
function onPlayerStateChange(e){
  const S = YT.PlayerState;
  if(e.data===S.PLAYING){
    watch.paused=false;
    if(!watch.duration) watch.duration = ytPlayer.getDuration();
  } else if(e.data===S.PAUSED){
    watch.paused=true;
  } else if(e.data===S.ENDED){
    watch.paused=true; watch.ended=true;
    // 15초 미만 영상은 여기서 처음 보상 지급, 15초 이상은 이미 지급됐으므로 재지급 안 함
    if(!watch.rewarded) grantRewardOnEnd();
    showAdCompletion();
  }
}
// 임베드 차단(101/150) 등 재생 실패 시 다른 랜덤 영상으로 자동 재시도 (최대 2회)
function onPlayerError(e){
  console.warn('YT player error', e && e.data);
  clearInterval(watch.timerId);
  if(adRetryCount < AD_MAX_RETRIES){
    adRetryCount++;
    startAdAttempt(pickAd());
  } else {
    showAdFallback();
  }
}
function grantChances(){

}
// adSkip(계속보기/돌아가기)과 좌하단 홈으로 버튼이 겹치지 않도록 서로 반대로 페이드

function grantRewardMidPlay(){

  setAdSkipVisible(true);
}
// 15초 미만 영상: 끝까지 재생 완료 시점에 지급

function showRewardToast(){

// 영상 자연 종료 시 완주 화면(CTA + 게임으로 돌아가기)으로 전환
function showAdCompletion(){
  clearInterval(watch.timerId);
  setAdSkipVisible(false);
  $('adStage').classList.add('hide');
  $('adDone').classList.remove('hide');
  setupCta(currentAd);
}
function setupCta(ad){
  const cta = $('adCta');
  if(ad.url){
    cta.textContent = ad.cta;
    cta.href = ad.url;
    cta.target = '_blank'; cta.rel = 'noopener';
    cta.classList.remove('hide');
  } else if(ad.internalLink){
    cta.textContent = ad.cta;
    cta.href = ad.internalLink;
    cta.removeAttribute('target'); cta.removeAttribute('rel');
    cta.classList.remove('hide');
  } else {
    cta.classList.add('hide');
    cta.removeAttribute('href');
  }
}
// 재생 자체가 끝내 실패한 경우: 영상 없이도 보상은 정상 지급

  setChances(getChances()+5);

}

}

function randCandidate(){
  const a = ADJ[Math.floor(Math.random()*ADJ.length)];
  const n = NOUN[Math.floor(Math.random()*NOUN.length)];
  return `${a} ${n}`;
}
// 후보 접두어(candidate%)로 개수 조회 후 0개면 그대로, 1개 이상이면 (count+1) 숫자를 붙임
async function generateUniqueNickname(excludeId){
  const base = randCandidate();
  try{
    let q = sb.from('players').select('id', { count:'exact', head:true }).like('nickname', base+'%');
    if(excludeId) q = q.neq('id', excludeId);
    const { count, error } = await q;
    if(error) throw error;
    return (count>0) ? base+(count+1) : base;
  }catch(e){
    console.error('nickname check error', e);
    return base;
  }
}
async function insertPlayerWithRetry(maxAttempts=5){
  for(let i=0;i<maxAttempts;i++){
    const nickname = await generateUniqueNickname();
    const { data, error } = await sb.from('players').insert({ nickname }).select().single();
    if(!error) return data;
    if(error.code !== '23505'){ console.error('player insert error', error); return null; }
    // 유니크 충돌(23505) → 새 후보로 재시도
  }
  return null;
}
async function insertRun(playerId, distanceKm, avgSpeedKmh, trainGrade){

    player_id: playerId,

}

}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// listEl 생략 시 게임오버 화면의 리더보드(#lbList). 홈 리더보드는 #lbHomeList 를 넘긴다.
function renderLeaderboardList(rows, myPlayerId, listEl){
  const list = listEl || $('lbList');
  if(!rows.length){ list.innerHTML = '<div class="lbEmpty">아직 기록이 없어요</div>'; return; }
  list.innerHTML = rows.map((r,i)=>{
    const nick = (r.players && r.players.nickname) || '익명';
    const mine = r.player_id === myPlayerId;
    return `<div class="lbRow${mine?' me':''}">
      <span class="lbRank">${i+1}</span>
      <span class="lbNick">${escapeHtml(nick)}</span>
      <span class="lbKm">${Number(r.distance_km).toFixed(1)}km</span>
      <span class="lbSpd">${Math.round(r.avg_speed_kmh)}km/h</span>
    </div>`;
  }).join('');
}
async function loadLeaderboard(myPlayerId, myKm, token){
  const { data, error } = await sb.from('runs')
    .select('distance_km, avg_speed_kmh, player_id, players(nickname)')
    .order('distance_km', { ascending:false })
    .limit(20);
  if(token !== lbRunToken) return;
  if(error){
    console.error('leaderboard load error', error);
    $('lbList').innerHTML = '<div class="lbEmpty">리더보드를 불러오지 못했어요</div>';
    return;
  }
  const rows = data || [];
  renderLeaderboardList(rows, myPlayerId);
  if(rows.some(r=>r.player_id===myPlayerId)){
    $('lbMyRank').classList.add('hide');
    return;
  }
  const { count, error: rankErr } = await sb.from('runs')
    .select('id', { count:'exact', head:true })
    .gt('distance_km', myKm);
  if(token !== lbRunToken) return;
  if(!rankErr){
    $('lbMyRank').textContent = `내 순위: ${(count||0)+1}위`;
    $('lbMyRank').classList.remove('hide');
  }
}
async function saveRunAndShowLeaderboard(km, avgSpeedKmh){
  const token = ++lbRunToken;
  resetLeaderboardUI();
  const grade = gradeFor(km);
  const player = await insertPlayerWithRetry();
  if(token !== lbRunToken) return;
  if(!player){ lbShowStatus('기록 저장에 실패했어요'); return; }
  currentPlayer = player;
  await insertRun(player.id, km, avgSpeedKmh, grade);
  if(token !== lbRunToken) return;
  renderMyNickname(player.nickname);
  $('lbStatus').classList.add('hide');
  $('lbMe').classList.remove('hide');
  await loadLeaderboard(player.id, km, token);
}
