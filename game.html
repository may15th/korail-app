function scr(s){ return { sx:W/2+(s.x*TILE*.62)-camX, sy:H*.66-(s.y*TILE*.52)+camY }; }
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ══════════ 배경: 밤하늘 (v0.2 원본 방식) ══════════ */
/* ══════════ 고도 배경 — 올라갈수록 풍경이 바뀐다 ══════════
   배경 아트(#bgArt)는 맨 아래 깔린 채로 두고, 그 위(#cvBg)에 절차적 하늘을 알파로
   덮어 크로스페이드한다. 별·성운은 하늘 위에 얹혀 km 에 따라 아래로 흐른다.
   (흰 구름 레이어는 화면을 뿌옇게 덮어 삭제함)

   km 는 사실상 고도다: 지상 → 구름 위 → 성층권 → 대기권 끝 → 우주.
   구간은 실제 플레이 거리에 맞춰 촘촘하게 잡았다(초보도 40km 쯤에서 변화를 본다).
   마지막 구간 이후(무한 운행)는 성운 색상만 계속 돌아간다.

     sky   절차적 하늘이 배경 아트를 덮는 정도 (0 = 아트 그대로, 1 = 완전히 하늘)
     star  별 밝기      neb 성운 농도 */
const SKY_BANDS = [
  { km:  0, top:[10,19,48], bot:[27,44,94], sky:0,   star:.15, neb:0   },  // 지상
  { km: 40, top:[ 8,15,40], bot:[20,35,78], sky:.28, star:.35, neb:0   },  // 구름 위
  { km:110, top:[ 5,10,28], bot:[12,22,54], sky:.60, star:.60, neb:.10 },  // 성층권
  { km:220, top:[ 3, 6,18], bot:[ 6,12,34], sky:.85, star:.85, neb:.40 },  // 대기권 끝
  { km:340, top:[ 1, 2, 9], bot:[ 3, 5,16], sky:1,   star:1,   neb:.75 },  // 우주
];
// 패럴랙스 속도(px/km). 선로는 약 12px/km 로 흐르므로 그보다 느릴수록 멀어 보인다.
const PAR_STAR = 1.3, PAR_NEB = 0.45;

const lerp = (a,b,t)=> a+(b-a)*t;
function skyAt(km){
  let i=0; while(i<SKY_BANDS.length-1 && km>=SKY_BANDS[i+1].km) i++;
  const a=SKY_BANDS[i], b=SKY_BANDS[Math.min(i+1,SKY_BANDS.length-1)];
  const t = (b===a||b.km===a.km) ? 0 : Math.max(0,Math.min(1,(km-a.km)/(b.km-a.km)));
  const mix=(p,q)=>`rgb(${Math.round(lerp(p[0],q[0],t))},${Math.round(lerp(p[1],q[1],t))},${Math.round(lerp(p[2],q[2],t))})`;
  return { top:mix(a.top,b.top), bot:mix(a.bot,b.bot),
           sky:lerp(a.sky,b.sky,t), star:lerp(a.star,b.star,t),
           neb:lerp(a.neb,b.neb,t) };
}

const skyStars  = Array.from({length:90},()=>({ x:Math.random(), y:Math.random(), r:Math.random()*1.3+.3, tw:Math.random()*6.28 }));
const skyNebs   = Array.from({length:3}, (_,i)=>({ x:Math.random(), y:Math.random(), r:Math.random()*.35+.35, hue:i*77 }));
const wrapv = (v,span)=> ((v%span)+span)%span;

function drawSky(t){
  const g = bgCtx, km = kmNow(), s = skyAt(km);
  const par = reduceMotion ? 0 : 1;      // 동작 줄이기: 색만 바뀌고 흐르지는 않는다

  // 하늘 — 배경 아트 위에 알파로 덮어 크로스페이드
  if(s.sky > .002){
    const grd = g.createLinearGradient(0,0,0,H);
    grd.addColorStop(0, s.top); grd.addColorStop(1, s.bot);
    g.save(); g.globalAlpha = s.sky; g.fillStyle = grd; g.fillRect(0,0,W,H); g.restore();
  }
  // 성운 — 가장 멀어서 가장 느리게. 무한 구간에선 색이 서서히 돈다.
  if(s.neb > .01){
    const span = H*1.8;
    g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha = s.neb*.45;
    for(const p of skyNebs){
      const y  = wrapv(p.y*span + km*PAR_NEB*par, span) - H*.4;
      const cx = p.x*W, r = p.r*W, hue = (p.hue + km*.25)%360;
      const grd = g.createRadialGradient(cx,y,0, cx,y,r);
      grd.addColorStop(0, `hsla(${hue},75%,62%,.55)`);
      grd.addColorStop(1, `hsla(${hue},75%,62%,0)`);
      g.fillStyle = grd;
      g.beginPath(); g.ellipse(cx, y, r, r*.66, 0, 0, 6.283); g.fill();
    }
    g.restore();
  }
  // 별
  if(s.star > .01){
    const span = H*1.4;
    g.save(); g.fillStyle='#cfe0ff';
    for(const p of skyStars){
      const y = wrapv(p.y*span + km*PAR_STAR*par, span) - H*.2;
      g.globalAlpha = s.star * (.45+.35*Math.sin(t*.001+p.tw));
      g.beginPath(); g.arc(p.x*W, y, p.r, 0, 6.283); g.fill();
    }
    g.restore();
  }
}

/* 속도선 — 부스터 중에도 speedMult(1.15~1.2배)만 따른다. 과속 서지 금지(스트로보 방지) */
function drawSpeedLines(t){
  const ctx = bgCtx;
  const vSpeed = speed * speedMult;            // 표시용 속도(실제 speed 값은 건드리지 않음)
  const n = Math.floor(vSpeed/16);
  ctx.strokeStyle='rgba(143,163,200,.28)'; ctx.lineWidth=2;
  for(let i=0;i<n;i++){
    const y = ((t*.6*(vSpeed/90) + i*167) % (H+120)) - 60;
    const x = (i*97)%W;
    const len = 24+vSpeed*.14;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-len*.35, y+len); ctx.stroke();
  }
}

/* 에셋에서 선로 중심선을 실측한 뒤, 호를 곧게 편 직선 띠(strip)를 만든다.
   에셋을 교체해도 중심선을 다시 재므로 좌표를 손으로 고칠 필요가 없다. */
const railStrip = {};
let railsReady = false;

function buildRailStrip(im){
  const N = im.width;
  const c = document.createElement('canvas'); c.width=N; c.height=N;
  const cx = c.getContext('2d', { willReadFrequently:true });
  cx.drawImage(im, 0, 0);
  const d = cx.getImageData(0,0,N,N).data;       // 같은 출처가 아니면 여기서 예외 → 폴백
  const al = (x,y)=> (x<0||y<0||x>=N||y>=N) ? 0 : d[((y|0)*N+(x|0))*4+3];

  // 1) 불투명 픽셀의 무게중심 + 주축(2차 모먼트) — 선로가 뻗은 방향
  let sx=0, sy=0, n=0;
  for(let y=0;y<N;y+=2) for(let x=0;x<N;x+=2) if(al(x,y)>60){ sx+=x; sy+=y; n++; }
  if(!n) throw new Error('불투명 픽셀 없음');
  const mx=sx/n, my=sy/n;
  let xx=0, yy=0, xy=0;
  for(let y=0;y<N;y+=2) for(let x=0;x<N;x+=2) if(al(x,y)>60){ const a=x-mx, b=y-my; xx+=a*a; yy+=b*b; xy+=a*b; }
  let ang = .5*Math.atan2(2*xy, xx-yy);
  if(Math.sin(ang) > 0) ang -= Math.PI;          // 항상 "위로 진행"(y 감소) 방향으로 통일
  const ux=Math.cos(ang), uy=Math.sin(ang), px=-uy, py=ux;

  // 2) 주축을 따라가며 밴드 중심/폭 측정 → 중심선 폴리라인
  const R = N, cen = new Array(2*R+1).fill(null), cov = new Array(2*R+1).fill(0);
  let halfMax = 0;
  for(let i=0;i<=2*R;i++){
    const t = i-R, ox = mx+ux*t, oy = my+uy*t;
    let lo=null, hi=null, wide=null, wideHi=null, cnt=0;
    for(let k=-140;k<=140;k++){
      const a = al(Math.round(ox+px*k), Math.round(oy+py*k));
      if(a>60){ if(lo===null) lo=k; hi=k; cnt++; }
      if(a>8){ if(wide===null) wide=k; wideHi=k; }
    }
    if(lo!==null){ cen[i]=(lo+hi)/2; cov[i]=cnt; halfMax=Math.max(halfMax, Math.abs(wide), Math.abs(wideHi)); }
  }
  // 2-b) 침목 주기만큼 이동평균 — 중심선은 침목 간격으로 진동한다(침목 구간은 폭이 넓고
  //      사이는 레일만 남아 중심이 흔들림). 이 노이즈까지 펴면 오히려 물결치므로 걸러낸다.
  const smooth = cen.slice(), sHalf = Math.round(RAIL_TIE_PITCH/2);
  for(let i=0;i<cen.length;i++){
    if(cen[i]===null) continue;
    let s=0, c=0;
    for(let j=Math.max(0,i-sHalf); j<=Math.min(cen.length-1,i+sHalf); j++) if(cen[j]!==null){ s+=cen[j]; c++; }
    smooth[i] = s/c;
  }

  // 3) 침목이 있는(폭이 넓은) 구간만 남기고 마감면 잘라내기
  const full = Math.max(...cov);
  let i0=0, i1=2*R;
  while(i0<i1 && cov[i0] < full*.6) i0++;
  while(i1>i0 && cov[i1] < full*.6) i1--;
  i0 += RAIL_END_MARGIN; i1 -= RAIL_END_MARGIN;
  const sliceLen = RAIL_TIE_PITCH*RAIL_TIES_PER_SEG;
  if(i1-i0 < sliceLen) throw new Error('쓸 수 있는 구간이 너무 짧음');
  const mid = (i0+i1)/2, T0 = Math.round(mid - sliceLen/2);   // 가운데에서 필요한 만큼만

  // 4) 얇은 띠로 쪼개 곧게 펴서 그린다 (띠마다 개별 회전 → 호가 직선이 됨)
  // 이음매 겹침만큼 띠를 양쪽으로 더 길게 뜬다(늘려 그리지 않으므로 침목 밀도는 그대로)
  const overA = sliceLen * (RAIL_JOINT_OVER / 37.22);
  const A0 = T0 - overA, A1 = T0 + sliceLen + overA;
  const k = RAIL_STRIP_PX / sliceLen;                          // 에셋 → 띠 스케일
  const sw = Math.round((A1-A0)*k), sh = Math.round(halfMax*2*k);
  const st = document.createElement('canvas'); st.width=sw; st.height=sh;
  const sc = st.getContext('2d');
  sc.imageSmoothingQuality = 'high';
  const pt = idx =>{                                           // 중심선(평활화) 위의 점
    const j = Math.max(0, Math.min(2*R, Math.round(idx)));
    const cc = smooth[j] ?? 0, t = j-R;
    return [mx+ux*t+px*cc, my+uy*t+py*cc];
  };
  for(let b=0;b<RAIL_BANDS;b++){
    const a0 = A0 + (A1-A0)*b/RAIL_BANDS, a1 = A0 + (A1-A0)*(b+1)/RAIL_BANDS;
    const p0 = pt(a0), p1 = pt(a1);   // a0/a1 은 이미 cen[] 인덱스
    const bl = Math.hypot(p1[0]-p0[0], p1[1]-p0[1]);
    if(!bl) continue;
    const x0 = (a0-A0)*k, x1 = (a1-A0)*k;
    sc.save();
    sc.beginPath(); sc.rect(x0, 0, x1-x0, sh); sc.clip();      // 이 띠 구간만
    sc.translate(x0, sh/2);
    sc.scale((x1-x0)/bl, (x1-x0)/bl);                          // 띠 길이에 맞춰 등방 스케일
    sc.rotate(-Math.atan2(p1[1]-p0[1], p1[0]-p0[0]));          // 띠를 수평으로
    sc.translate(-p0[0], -p0[1]);
    sc.drawImage(im, 0, 0);
    sc.restore();
  }
  return { cv:st, over:RAIL_JOINT_OVER, halfRatio:(halfMax*2)/sliceLen };
}

/* 열차 스프라이트 로드 — 실패하면 기존 절차적 열차로 폴백 */
const trainImg = {};
(function loadTrains(){
  for(const key of ['-1','1']){
    const im = new Image();
    im.onload  = ()=> trainImg[key] = im;
    im.onerror = ()=> console.warn('열차 에셋 로드 실패 — 기본 도형 사용:', TRAIN_SRC[key]);
    im.src = TRAIN_SRC[key];
  }
})();

/* ══════════ 기관사 토끼 ══════════ */
const headImg = {};
(function loadHeads(){
  for(const [k, h] of Object.entries(RABBIT_HEADS)){
    const im = new Image();
    im.onload = ()=> headImg[k] = im;
    im.src = h.src;
  }
})();
let headState='idle', headPopT=-1e9, inDanger=false, inPanic=false, cheerUntil=0, phewUntil=0;
// 게이지 경계에 간격(히스테리시스)을 둬서 21↔23% 를 오갈 때 표정이 깜빡이지 않게 한다
function updateDangerFlags(now){
  const was = inDanger;
  inPanic  = inPanic  ? gauge <= PANIC_OUT  : gauge <= PANIC_IN;
  inDanger = inDanger ? gauge <= DANGER_OUT : gauge <= DANGER_IN;
  if(was && !inDanger && playing) phewUntil = now + PHEW_MS;   // 위기 탈출 "휴~"
}
function rabbitCheer(){ cheerUntil = performance.now() + CHEER_MS; }
// 우선순위: 탈선 > 절체절명 > 위기 > 부스터 > 역 통과 > 휴~ > 콤보 30+ > 콤보 15+ > 기본
function pickHead(now){
  if(crashT >= 0)       return 'surprised';
  if(!playing)          return 'idle';
  if(inPanic)           return 'sad';
  if(inDanger)          return 'cry';
  if(boosting)          return 'cool';
  if(now < cheerUntil)  return 'cheer';
  if(now < phewUntil)   return 'wink';
  if(combo >= COMBO_CONFETTI) return 'confetti';
  if(combo >= COMBO_CLAP)     return 'clap';
  return 'idle';
}
// 지붕 창 위에 똑바로 선 머리(열차와 같이 돌지 않는다 — 기울면 표정이 안 읽힌다).
// wx, wy = 창의 화면 위치, sqx/sqy = 열차 점프 찌그러짐(같이 통통), facing = 탈선 방향
function drawRabbit(wx, wy, sqx, sqy, facing){
  const now = performance.now();
  const st = pickHead(now);
  if(st !== headState){ headState = st; headPopT = vClock; }
  const im = headImg[st] || headImg.idle;
  if(!im) return;
  const meta = RABBIT_HEADS[headImg[st] ? st : 'idle'];
  const h = HEAD_H, w = h * im.width / im.height;
  let ox = 0, oy = 0, rot = 0, sc = 1;
  if(!reduceMotion){
    const k = (vClock - headPopT) / HEAD_POP_MS;           // 표정 전환 팝
    if(k < 1) sc = 1 + .18 * (1-k) * (1-k);
    if(st === 'sad')      ox = Math.sin(vClock * .11) * 1.6;   // 떨림 — 땀방울만으론 약해서 움직임으로 보강
    else if(st === 'cry') ox = Math.sin(vClock * .08) * 1.0;
    if(crashT >= 0){                                        // 탈선: 머리가 튕겨 날아간다
      const c = crashT;
      ox += -facing * c * 1.3;
      oy += -c * 3.2 + c * c * .16;
      rot = -facing * c * .09;
    }
  }
  ctx.save();
  ctx.translate(wx + ox, wy + oy);
  ctx.rotate(rot);
  ctx.scale(sqx * sc, sqy * sc);                         // 발밑(창) 기준으로 커지고 찌그러진다
  ctx.drawImage(im, -w * meta.ax, -h * (1 - HEAD_SINK), w, h);
  ctx.restore();
}

(function loadRails(){
  let left = 2;
  for(const key of ['-1','1']){
    const im = new Image();
    im.onload = ()=>{
      try{ railStrip[key] = buildRailStrip(im); }
      catch(e){ console.warn('레일 스프라이트 생성 실패 — 절차적 선로 사용:', e.message); return; }
      if(--left === 0) railsReady = true;
    };
    im.onerror = ()=> console.warn('레일 에셋 로드 실패 — 절차적 선로 사용:', RAIL_SRC[key]);
    im.src = RAIL_SRC[key];
  }
})();

/* 곧게 편 띠를 세그먼트마다 회전·배치만 한다(왜곡·꺾임 없음) */
function drawTrackSprite(){
  const from=Math.max(0,pos-10), to=Math.min(steps.length-1,pos+26);   // 확대 1.5배 기준 화면 아래까지 채움
  const g = tieCtx;                      // 선로 전용 레이어(기차·파티클보다 아래)
  for(let i=from;i<to;i++){
    const a=scr(steps[i]), b=scr(steps[i+1]);
    const dx=b.sx-a.sx, dy=b.sy-a.sy, segLen=Math.hypot(dx,dy);
    if(!segLen) continue;
    const st = railStrip[steps[i].dir<0 ? '-1' : '1'];
    if(!st) continue;
    const over = st.over, h = segLen*st.halfRatio;
    const passed = i<pos, active = i===pos;

    g.save();
    g.translate(a.sx, a.sy);
    g.rotate(Math.atan2(dy,dx));          // +x = 세그먼트 진행 방향
    g.globalAlpha = passed ? RAIL_PASSED_A : 1;
    g.drawImage(st.cv, -over, -h/2, segLen+over*2, h);
    if(active){                           // 밟을 차례 구간만 가산합성으로 네온 강조
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = RAIL_ACTIVE_A;
      g.drawImage(st.cv, -over, -h/2, segLen+over*2, h);
    }
    g.restore();
  }
}

function drawTrack(){ railsReady ? drawTrackSprite() : drawTrackProc(); }

/* 에셋 로드 전(또는 실패 시) 폴백으로 쓰는 절차적 선로 */
function drawTrackProc(){
  const from=Math.max(0,pos-10), to=Math.min(steps.length-1,pos+26);   // 확대 1.5배 기준 화면 아래까지 채움
  for(let i=from;i<to;i++){
    const a=scr(steps[i]), b=scr(steps[i+1]);
    const dx=b.sx-a.sx, dy=b.sy-a.sy, len=Math.hypot(dx,dy);
    const nx=-dy/len, ny=dx/len;
    const passed = i<pos, active = i===pos;
    // 레일 한 쌍(양쪽 offset)을 현재 스타일로 긋는 헬퍼
    const rail = o=>{ ctx.beginPath(); ctx.moveTo(a.sx+nx*o,a.sy+ny*o); ctx.lineTo(b.sx+nx*o,b.sy+ny*o); ctx.stroke(); };

    /* 1. 침목 — 전용 레이어(tieCtx)에 그린다.
       부스터 중 이 레이어에만 blur 가 걸려 개별 침목이 끊겨 보이지 않고 광선 줄무늬가 된다. */
    tieCtx.save();
    tieCtx.lineCap='round';
    for(let k=1;k<=4;k++){
      const px=a.sx+dx*k/5, py=a.sy+dy*k/5;
      // 침목 아래의 은은한 그림자
      tieCtx.strokeStyle='rgba(3, 8, 30, .75)'; tieCtx.lineWidth=5;
      tieCtx.beginPath(); tieCtx.moveTo(px+nx*12,py+ny*12); tieCtx.lineTo(px-nx*12,py-ny*12); tieCtx.stroke();
      // 실제 침목
      tieCtx.strokeStyle = passed ? 'rgba(37, 67, 120, .42)' : 'rgba(75, 116, 180, .72)';
      tieCtx.lineWidth=2.6;
      tieCtx.beginPath(); tieCtx.moveTo(px+nx*11,py+ny*11); tieCtx.lineTo(px-nx*11,py-ny*11); tieCtx.stroke();
    }
    tieCtx.restore();

    ctx.save();
    ctx.lineCap='round';

    // 2. 레일의 어두운 구조물
    ctx.strokeStyle='rgba(3, 10, 32, .95)'; ctx.lineWidth=7;
    for(const o of [-6.5,6.5]) rail(o);

    // 3. 레일 본체
    ctx.strokeStyle = passed ? '#263D69' : '#416CA8'; ctx.lineWidth=3.8;
    for(const o of [-6.5,6.5]) rail(o);

    // 4. 얇은 Cyan 하이라이트
    ctx.strokeStyle = passed ? 'rgba(63, 130, 190, .28)' : 'rgba(125, 211, 252, .78)';
    ctx.lineWidth=1.15;
    for(const o of [-6.5,6.5]) rail(o);

    // 5. 현재 달려야 하는 선로만 네온 발광
    if(active){
      ctx.shadowColor='#0EA5E9'; ctx.shadowBlur=18;          // 넓고 약한 외곽광
      ctx.strokeStyle='rgba(14, 165, 233, .38)'; ctx.lineWidth=4.5;
      for(const o of [-6.5,6.5]) rail(o);
      ctx.shadowColor='#38BDF8'; ctx.shadowBlur=8;           // 선명한 cyan 중심광
      ctx.strokeStyle='#A5E9FF'; ctx.lineWidth=1.7;
      for(const o of [-6.5,6.5]) rail(o);
    }

    ctx.restore();   // lineCap·shadowBlur 등 상태 원복
  }
}
function drawParticles(){
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.14; p.life-=.045;
    if(p.life<=0){ sparks.splice(i,1); continue; }
    ctx.globalAlpha=p.life; ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.r+=9; r.life-=.03;
    if(r.life<=0){ rings.splice(i,1); continue; }
    ctx.globalAlpha=r.life*.7; ctx.strokeStyle='#2f6bff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(trainX, trainY-10, r.r, 0, 6.283); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawTrain(boost){
  boost = boost||0;
  let lift = 0, sqx = 1, sqy = 1;               // 점프 높이 · 찌그러짐(손맛 ON 전용)
  if(feelOn()){
    // 즉시 반응: HOP_MS 안에 다음 칸 도착(ease-out) + 포물선 점프 + 착지 찌그러짐.
    // 칸이 바뀌면(탭) 지금 열차가 있는 곳 — 점프 중이면 그 중간 — 에서 새 칸으로 다시 튄다.
    const goalX = steps[pos].x*TILE*.62, goalY = steps[pos].y*TILE*.52;
    if(goalX !== hopToX || goalY !== hopToY){
      hopFromX = trainWX; hopFromY = trainWY; hopToX = goalX; hopToY = goalY; hopT0 = vClock;
    }
    const hopMs = HOP_MS / speedMult;
    const p = Math.min(1, (vClock - hopT0) / hopMs);
    const e = 1 - Math.pow(1 - p, 3);
    trainWX = hopFromX + (hopToX - hopFromX) * e;
    trainWY = hopFromY + (hopToY - hopFromY) * e;
    trainX = W/2 + trainWX - camX;
    trainY = H*.66 - trainWY + camY;
    if(!reduceMotion){
      if(p < 1){
        const arc = Math.sin(Math.PI * p);
        lift = arc * HOP_LIFT;
        sqx = 1 - HOP_STRETCH*arc; sqy = 1 + HOP_STRETCH*arc;
      } else {
        const k = (vClock - hopT0 - hopMs) / LAND_MS;
        if(k < 1){ const q = LAND_SQUASH * (1-k)*(1-k); sqx = 1 + q; sqy = 1 - q; }
      }
    }
  } else {
    const cur = scr(steps[pos]);
    const ease = Math.min(.9, .38*speedMult);   // 열차 이동 속도도 배율을 따름
    trainX += (cur.sx-trainX)*ease;
    trainY += (cur.sy-trainY)*ease;
    trainWX = trainX - W/2 + camX; trainWY = H*.66 - trainY + camY;   // 스위치 전환 시 튀지 않게 동기화
  }
  let tx=trainX, ty=trainY, rot=tilt;
  const facing = steps[pos].dir;
  const bw=36,bh=21;

  if(crashT>=0){
    crashT++;
    tx += -facing*crashT*2.4;
    ty += crashT*crashT*.36;
    rot = -facing*crashT*.07;
    if(crashT>44){ crashT=-1; finishOver(); }
  }

  // (헤드라이트 빔 삭제 — 속도에 따라 커지는 연노랑 원이 기차 주변을 하얗게 덮었다)

  const key = facing<0 ? '-1' : '1';
  const im = trainImg[key];
  if(im){
    // 스프라이트: 에셋 주축을 현재 선로 진행 방향에 맞춰 회전시켜 얹는다
    const geo = TRAIN_GEO[key];
    const nxt = steps[pos+1] || steps[pos];
    const n2 = scr(nxt), c2 = scr(steps[pos]);
    const segAng = (nxt===steps[pos]) ? geo.dir : Math.atan2(n2.sy-c2.sy, n2.sx-c2.sx);
    const s = TRAIN_LEN / TRAIN_ASSET_LEN;
    const spin = segAng - geo.dir + rot;
    const put = (px,py,alpha,squash)=>{
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);
      if(squash) ctx.scale(sqx, sqy);          // 화면 기준 세로 찌그러짐 — 회전 전에 걸어야 "통통" 느낌
      ctx.rotate(spin); ctx.scale(s,s);
      ctx.translate(-geo.cx, -geo.cy);
      ctx.drawImage(im, 0, 0);
      ctx.restore();
    };
    // 부스터 빛 궤적 — 진행 방향 반대편으로 옅어지는 잔상
    if(boost>0){
      const bx = Math.cos(segAng), by = Math.sin(segAng);
      for(let ghost=3; ghost>=1; ghost--){
        const off = ghost*9;
        put(tx-bx*off, ty-TRAIN_LIFT-by*off, .22*boost*(1-(ghost-1)*.22));
      }
    }
    put(tx, ty-TRAIN_LIFT-lift, 1, true);
    if(rabbitOn()){
      // 지붕 창의 화면 위치 = put() 과 같은 변환(찌그러짐 → 회전 → 축척)을 창 좌표 한 점에 적용
      const win = TRAIN_WINDOW[key];
      const vx = (win.x - geo.cx) * s, vy = (win.y - geo.cy) * s;
      const c = Math.cos(spin), sn = Math.sin(spin);
      drawRabbit(tx + sqx*(c*vx - sn*vy), ty-TRAIN_LIFT-lift + sqy*(sn*vx + c*vy), sqx, sqy, facing);
    }
  } else {
    // 에셋 로드 전 폴백: 기존 절차적 열차
    if(boost>0){
      for(let ghost=3; ghost>=1; ghost--){
        const off = ghost*9;
        ctx.save();
        ctx.globalAlpha = .22*boost*(1-(ghost-1)*0.22);
        ctx.translate(tx-facing*off, ty-12); ctx.rotate(rot);
        ctx.fillStyle='#7DD3FC';
        roundRect(-bw/2,-bh/2,bw,bh,10); ctx.fill();
        ctx.restore();
      }
    }
    ctx.save();
    ctx.translate(tx, ty-12-lift); ctx.scale(sqx, sqy); ctx.rotate(rot);
    ctx.fillStyle='#eef2ff'; roundRect(-bw/2,-bh/2,bw,bh,10); ctx.fill();
    ctx.fillStyle='#2f6bff'; roundRect(-bw/2,2,bw,7,3); ctx.fill();
    ctx.fillStyle='#1a2340'; roundRect(-bw/2+6,-6,bw-12,7,3); ctx.fill();
    ctx.fillStyle='#ffe9a3';
    ctx.beginPath(); ctx.arc(facing*(bw/2-3),0,3.2,0,6.283); ctx.fill();
    ctx.restore();
    if(rabbitOn()) drawRabbit(tx, ty-12-lift-4, sqx, sqy, facing);
  }
}

/* ══════════ 루프 ══════════ */
function loop(t){
  // 일시정지: 갱신도 그리기도 건너뛴다(캔버스엔 마지막 프레임이 그대로 남는다)
  if(paused){ tPrev=t; requestAnimationFrame(loop); return; }
  const dt = Math.min(50, t-tPrev)/1000; tPrev=t;
  const now = performance.now();
  const frozen = now < freezeUntil;            // 순간 멈춤: 화면 시계·카메라·열차 그림만 정지
  if(!frozen) vClock += dt*1000;

  // ── 부스터 수명 관리 ──
  if(boosting && now >= boostEnd) endBoost();
  // 시간 창을 못 채운 채 넘겼으면 게이지 리셋(입력이 끊겨도 제때 풀리도록 루프에서도 체크)
  if(!boosting && chargeTaps>0 && now - chargeStart > BOOST_WINDOW_MS) failCharge();
  // 배율은 즉시 바뀌지 않고 BOOST_RAMP_MS 동안 ease-in-out 으로 보간(급격한 시야 변화 방지)
  speedMult = rampFrom + (rampTo-rampFrom) * easeInOutCubic(Math.min(1,(now-rampStart)/BOOST_RAMP_MS));
  const boostVis = Math.max(0, Math.min(1, (speedMult-1)/(BOOST_SPEED_MULT-1)));
  updateStreaks(dt);

  const tgt = steps[pos];
  if(!frozen){
    camX += (tgt.x*TILE*.62 - camX)*Math.min(.9, .14*speedMult);   // 스크롤 속도 = 배율
    camY += (tgt.y*TILE*.52 - camY)*Math.min(.9, .14*speedMult);
  }

  tilt *= .82;
  speed *= .975;
  if(speed<0) speed=0;
  if(playing){ speedTimeAcc += dt; speedSampleAcc += speed*dt; }
  if(playing && performance.now()-lastTapT>700 && combo){ combo=0; updateHUD(); }
  shake *= .86;

  // 주행 속도 → 음악 강도(음량·밀도만, 템포는 그대로). 오디오 이벤트가 쌓이지 않게 200ms 간격으로만,
  // 부스터·덕킹·페이드인 중엔 그쪽 레벨을 덮어쓰지 않도록 건너뛴다.
  if(playing && !boosting && now >= musicHoldUntil && now - lastIntensityT > 200){
    lastIntensityT = now;
    RRAudio.setIntensity(speed / 320);         // speed 는 0~320 km/h
  }

  if(playing && pos>=5){                       // 초반 5걸음은 게이지 동결(진입 장벽 완화)
    gauge -= (10 + Math.min(18, kmNow()*.04)) * dt;
    if(gauge<=0){ gauge=0; derail(); }
  }

  // 화면 흔들림(shake)은 충돌·역 통과 피드백 전용. 부스터는 흔들지 않는다.
  const shx = shake>.4 ? (Math.random()-.5)*shake : 0;
  const shy = shake>.4 ? (Math.random()-.5)*shake : 0;
  // 배경은 #bgArt(CSS)가 깔아주므로 세 캔버스 모두 투명하게 비우고 시작한다
  bgCtx.clearRect(0,0,W,H); tieCtx.clearRect(0,0,W,H); ctx.clearRect(0,0,W,H);
  for(const c of [bgCtx,tieCtx,ctx]){ c.save(); c.translate(shx,shy); }
  if(playing) updateDangerFlags(now);

  drawSky(t);                          // 고도에 따라 변하는 하늘 + 별·성운
  if(speed>40) drawSpeedLines(t);
  // 월드 확대 — 선로·기차·파티클만. 기준점은 열차가 서는 화면 위치
  for(const c of [tieCtx,ctx]){
    c.save(); c.translate(W/2, H*.66); c.scale(WORLD_ZOOM, WORLD_ZOOM); c.translate(-W/2, -H*.66);
  }
  drawTrack();            // 침목 → tieCtx / 레일 → ctx
  drawTrain(boostVis);
  drawParticles();
  for(const c of [tieCtx,ctx]) c.restore();
  drawStreaks();          // 부스터 전용 방사형 스피드라인(화면 기준 — 확대하지 않음)

  for(const c of [bgCtx,tieCtx,ctx]) c.restore();

  updateGaugeBar();
  updateBoostUI(now);
  requestAnimationFrame(loop);
}
genSteps(); updateHUD();
// 페이지를 새로 열었을 때도 기회가 0이면 무료 "운행 시작" 화면 대신 광고 유도 화면을 바로 띄운다
if(getChances()<=0){
  $('startOv').classList.add('hidden');
  showGameOverIdle();
}
requestAnimationFrame(t=>{ tPrev=t; requestAnimationFrame(loop); });
})();
</script>
