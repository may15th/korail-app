<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코레일플러스 — 홈</title>
<link rel="stylesheet" href="app.css">
<script src="fit.js"></script>
<style>
  /* ═══ 미니게임 폴더 오버레이 (갤럭시 앱 폴더 스타일) ═══ */
  .folder-overlay{position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;}
  .folder-overlay.hidden{display:none;}

  .folder-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    opacity:0;transition:opacity .28s ease;}
  .folder-overlay.show .folder-bg{opacity:1;}

  .folder-container{position:relative;width:300px;max-width:80vw;
    background:#1D1F29;border-radius:28px;padding:19.335px 20px 19.99px;
    transform:scale(.3);opacity:0;
    transform-origin:var(--origin-x,50%) var(--origin-y,50%);
    transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .22s ease;
    box-shadow:0 20px 30px rgba(0,0,0,.5);}
  .folder-overlay.show .folder-container{transform:scale(1);opacity:1;}

  .folder-header h2{font-size:17.8px;line-height:21.33px;font-weight:700;}
  .folder-sub{margin-top:4.01px;font-size:13.5px;line-height:16.36px;color:#91939A;}

  /* 갤럭시 폴더 스타일 — Figma node 24:2887 실측값(피그마 프레임 "Background+Shadow") 그대로 적용 */
  .folder-grid{display:flex;align-items:flex-start;gap:12px;margin-top:16px;}
  .folder-app{position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    border:0;cursor:pointer;font-family:inherit;color:var(--txt);}

  .folder-app.main{width:78px;gap:6px;background:none;padding:0;}
  .folder-icon{position:relative;width:78px;height:78px;border-radius:18px;}
  .folder-icon img{position:absolute;inset:0;width:100%;height:100%;
    border-radius:18px;object-fit:cover;}
  .folder-app.main .label{font-size:13.5px;line-height:16.36px;font-weight:700;text-align:center;}

  .folder-app.locked{width:78.67px;height:79.31px;gap:8px;
    padding:14.15px 8px 14.16px;border-radius:18px;
    opacity:.55;background:rgba(255, 255, 255, 0.05);}
  .folder-app.locked .lock-icon{position:absolute;top:8px;right:8px;font-size:12px;}
  .folder-app.locked .q-icon{font-size:26px;line-height:1;}
  .folder-app.locked .hint{font-size:13.5px;line-height:16.36px;font-weight:600;color:#91939A;}

  .folder-app .badge-new{position:absolute;top:-6px;left:-6px;
    background:#0156D0;color:#fff;font-size:10px;
    padding:2px 8px;border-radius:10px;font-weight:700;}

  /* Coming soon 모달 */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.6);padding:24px;opacity:0;transition:opacity .2s ease;}
  .modal.hidden{display:none;}
  .modal.show{opacity:1;}
  .modal-box{width:100%;max-width:280px;background:var(--card-alt);
    border-radius:var(--r-card);padding:24px 20px;text-align:center;}
  .modal-box h3{font-size:var(--fs-2xl);line-height:var(--lh-2xl);font-weight:700;}
  .modal-box p{margin-top:10px;font-size:var(--fs-sm);line-height:1.6;color:var(--dim);}
  .modal-box button{margin-top:18px;width:100%;height:var(--tap);border:0;
    border-radius:var(--r-field);background:var(--primary);color:#fff;
    font-family:inherit;font-size:var(--fs-lg);font-weight:700;cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    .folder-bg,.folder-container,.modal{transition:none;}
  }
</style>
</head>

<!-- ═══ 미니게임 폴더 오버레이 ═══ -->
<div id="folderOverlay" class="folder-overlay hidden">
  <div id="folderBg" class="folder-bg"></div>
  <div id="folderContainer" class="folder-container">
    <div class="folder-header">
      <h2>미니게임</h2>
      <p class="folder-sub">기차와 함께하는 즐거운 순간들</p>
    </div>
    <div class="folder-grid">
      <a class="folder-app main" href="game.html" data-transition="fade">
        <span class="folder-icon">
          <img src="img/ic_railrun.png" alt="">

        </span>

      </a>
      <button class="folder-app locked" type="button" data-hint="겨울 준비중">
        <span class="lock-icon">🔒</span>
        <span class="q-icon">?</span>
        <span class="hint">겨울 준비중</span>
      </button>
      <button class="folder-app locked" type="button" data-hint="준비중">
        <span class="lock-icon">🔒</span>
        <span class="q-icon">?</span>
        <span class="hint">준비중</span>
      </button>
    </div>
  </div>
</div>

<div id="comingSoonModal" class="modal hidden">
  <div class="modal-box">
    <h3>곧 만나요!</h3>
    <p>다음 업데이트에서 새로운 미니게임을 <br> 공개할 예정이에요.</p>
    <button id="modalConfirm" type="button">확인</button>
  </div>
</div>

<script>
(() => {
  const cell = document.getElementById('miniGameCell');
  const overlay = document.getElementById('folderOverlay');
  const bg = document.getElementById('folderBg');
  const container = document.getElementById('folderContainer');
  const modal = document.getElementById('comingSoonModal');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 클릭한 아이콘 위치를 transform-origin(%)으로 환산해
  // "그 자리에서 커지는" 갤럭시 폴더 느낌을 낸다.
  // offsetWidth/Height 는 transform(scale)의 영향을 받지 않는 실제 레이아웃
  // 크기라, 컨테이너가 아직 scale(.3) 상태여도 최종 크기를 그대로 읽을 수 있다.
  function openFolder(){
    const r = cell.getBoundingClientRect();
    const iconCX = r.left + r.width/2;
    const iconCY = r.top + r.height/2;

    overlay.classList.remove('hidden');
    const cw = container.offsetWidth, ch = container.offsetHeight;
    const cLeft = (innerWidth - cw)/2, cTop = (innerHeight - ch)/2;
    container.style.setProperty('--origin-x', (cw ? ((iconCX-cLeft)/cw)*100 : 50)+'%');
    container.style.setProperty('--origin-y', (ch ? ((iconCY-cTop)/ch)*100 : 50)+'%');

    history.pushState({ folderOpen:true }, '');

    if(reduceMotion){ overlay.classList.add('show'); return; }
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=> overlay.classList.add('show'));
    });
  }
  function closeFolderVisual(){
    overlay.classList.remove('show');
    if(reduceMotion) overlay.classList.add('hidden');
  }
  // 뒤로가기와 배경 클릭이 같은 닫힘 경로(popstate)를 타도록 통일
  function requestCloseFolder(){
    if(history.state && history.state.folderOpen) history.back();
    else closeFolderVisual();
  }
  container.addEventListener('transitionend', ()=>{
    if(!overlay.classList.contains('show')) overlay.classList.add('hidden');
  });
  window.addEventListener('popstate', ()=>{
    if(!modal.classList.contains('hidden')) closeModal();
    if(!overlay.classList.contains('hidden')) closeFolderVisual();
  });
  // 이 페이지를 벗어날 때(레일런 진입 등 실제 페이지 이동)는 폴더/모달을
  // 즉시 닫힌 기본 상태로 되돌려 둔다. 뒤로가기(bfcache 복원)는 이 시점의
  // DOM 스냅샷을 그대로 보여주므로, 그래야 game.html → 뒤로가기 시
  // "폴더가 열린 홈화면"이 아니라 기본 홈화면이 보인다.
  window.addEventListener('pagehide', ()=>{
    overlay.classList.remove('show');
    overlay.classList.add('hidden');
    modal.classList.remove('show');
    modal.classList.add('hidden');
  });

  cell.addEventListener('click', e=>{
    e.preventDefault();
    openFolder();
  });
  bg.addEventListener('click', requestCloseFolder);

  function openModal(){
    modal.classList.remove('hidden');
    if(reduceMotion){ modal.classList.add('show'); return; }
    requestAnimationFrame(()=> modal.classList.add('show'));
  }
  function closeModal(){
    modal.classList.remove('show');
    if(reduceMotion) modal.classList.add('hidden');
  }
  modal.addEventListener('transitionend', ()=>{
    if(!modal.classList.contains('show')) modal.classList.add('hidden');
  });
  document.querySelectorAll('.folder-app.locked').forEach(btn=>{
    btn.addEventListener('click', openModal);
  });
  document.getElementById('modalConfirm').addEventListener('click', closeModal);
  modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
})();
</script>
</body>
