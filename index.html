<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코레일플러스 — 홈</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-demo="on">
<div class="app home">

  <!-- ═══ 헤더 (고정) ═══ -->
  <header class="appbar">
    <img class="logo" src="img/logo.png" alt="KORAIL">
    <div class="spacer"></div>
    <img class="pill" src="img/pill_bigtext.png" alt="큰글씨">
    <img class="hic" src="img/ic_lang.png" alt="언어">
    <img class="hic" src="img/ic_bell.png" alt="알림">
    <img class="hic" src="img/ic_cart.png" alt="장바구니">
  </header>

  <!-- ═══ 스크롤 영역 ═══ -->
  <main class="scroll">
    <h1 class="title">어디로 떠나볼까요?</h1>

    <!-- 검색 카드 -->
    <section class="card search">
      <div class="stations">
        <div class="st">
          <span class="lb">출발역</span>
          <span class="nm">부산<img class="arw" src="img/arrow.png" alt=""></span>
        </div>
        <img class="swap" src="img/ic_swap.png" alt="바꾸기">
        <div class="st">
          <span class="lb">도착역</span>
          <span class="nm">경주<img class="arw" src="img/arrow.png" alt=""></span>
        </div>
      </div>

      <div class="fld"><span class="lb">가는날</span><span class="vl">2026년 9월 4일 (금) 16:43</span></div>
      <div class="fld-row">
        <div class="fld"><span class="lb">인원</span><span class="vl">어른 1명</span></div>
        <div class="fld"><span class="lb">좌석</span><span class="vl">일반 좌석</span></div>
      </div>

      <div class="btns"><button>간편 예매</button><button>열차 조회</button></div>
    </section>

    <!-- 배너 -->
    <img class="banner" src="img/banner.png" alt="2026 추석 연휴 승차권 예매 바로가기">

    <!-- 정기권 / N카드 / 특가 상품 -->
    <section class="card quick">
      <a class="cell"><span class="ic"><img src="img/ic_pass.png" style="width:24.18px"></span><span class="lb">정기권</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_ncard.png" style="width:27.73px"></span><span class="lb">N카드</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_special.png" style="width:25.96px"></span><span class="lb">특가 상품</span></a>
    </section>

    <!-- 서비스 그리드 4×3 -->
    <section class="card grid">
      <a class="cell"><span class="ic"><img src="img/ic_map.png"     style="width:27.73px"></span><span class="lb">길안내</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_parking.png" style="width:24.18px"></span><span class="lb">주차·정산</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_bus.png"     style="width:32.00px"></span><span class="lb">공항버스</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_coffee.png"  style="width:27.38px"></span><span class="lb">커피&amp;빵</span></a>

      <a class="cell"><span class="ic"><img src="img/ic_rent.png"    style="width:29.16px"></span><span class="lb">렌터카</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_share.png"   style="width:29.16px"></span><span class="lb">카셰어링</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_stay.png"    style="width:24.18px"></span><span class="lb">숙박</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_leisure.png" style="width:22.76px"></span><span class="lb">레저이용권</span></a>

      <a class="cell"><span class="ic"><img src="img/ic_taxi.png"    style="width:29.16px"></span><span class="lb">관광택시</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_lug.png"     style="width:22.76px"></span><span class="lb">짐배송</span></a>
      <a class="cell"><span class="ic"><img src="img/ic_parcel.png"  style="width:30.58px"></span><span class="lb">레일택배</span></a>

      <!-- ★ 신규 -->
      <a class="cell new" href="game.html">
        <span class="ic"><img src="img/ic_game.png" style="width:29.87px"></span>
        <span class="lb">미니게임</span>
      </a>
    </section>

    <!-- 하단 2카드 -->
    <div class="duo">
      <a class="card tile">
        <img class="tic" src="img/tile_trainmap.png" alt="">
        <span class="tt">열차 지도 보기</span>
        <span class="td">모든 열차 운행 정보를 한 눈에 확인</span>
      </a>
      <a class="card tile">
        <img class="tic" src="img/tile_railplus.png" alt="">
        <span class="tt">레일플러스</span>
        <span class="td">KTX 마일리지로 대중교통까지!</span>
      </a>
    </div>

    <div class="tail"></div>
  </main>

  <!-- ═══ 탭바 (고정) ═══ -->
  <nav class="tabbar">
    <a class="tab on" href="index.html"><img class="on-i" src="img/tab_home_on.png"><img class="off-i" src="img/tab_home_off.png"><span>홈</span></a>
    <a class="tab"><img class="on-i" src="img/tab_move_off.png"><img class="off-i" src="img/tab_move_off.png"><span>이동 · 편의</span></a>
    <a class="tab"><img class="on-i" src="img/tab_travel_off.png"><img class="off-i" src="img/tab_travel_off.png"><span>여행</span></a>
    <a class="tab"><img class="on-i" src="img/tab_ticket_off.png"><img class="off-i" src="img/tab_ticket_off.png"><span>나의 티켓</span></a>
    <a class="tab cue" href="allmenu.html"><img class="on-i" src="img/tab_menu_on.png"><img class="off-i" src="img/tab_menu_off.png"><span>전체메뉴</span></a>
  </nav>

</div>
</body>
</html>
