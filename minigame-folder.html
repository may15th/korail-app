<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코레일플러스 — 미니게임</title>
<link rel="stylesheet" href="app.css">
<script src="fit.js"></script>
<style>
  /* ── 폴더 진입 애니메이션: fit.js 가 쓰는 .app 의 반응형 scale(var(--s))과
     충돌하지 않도록 내부 래퍼(.mg-enter)에만 적용 ── */
  .mg-enter{display:flex;flex-direction:column;height:100%;
    transform-origin:center center;animation:expandIn .25s ease-out both;}
  @keyframes expandIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .mg-enter{animation:none;}
  }

  .mg-head{padding:18px var(--gutter) 2px;}
  .mg-title{font-size:var(--fs-2xl);line-height:var(--lh-2xl);font-weight:700;}
  .mg-sub{margin-top:4px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--dim);}

  .mg-grid{padding:16px var(--gutter) 24px;display:grid;
    grid-template-columns:1fr 1fr;gap:12px;}

  .mg-card{position:relative;background:var(--card);border-radius:var(--r-card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px 12px;overflow:hidden;cursor:pointer;}
  .mg-card.railrun{grid-column:1 / -1;padding:30px 12px;}
  .mg-card .mg-ic{font-size:38px;line-height:1;}
  .mg-card.railrun .mg-ic{font-size:54px;}
  .mg-card .mg-lb{margin-top:10px;font-size:var(--fs-lg);line-height:var(--lh-lg);font-weight:700;}
  .mg-card.railrun .mg-lb{font-size:var(--fs-2xl);line-height:var(--lh-2xl);}
  .mg-card .mg-badge{position:absolute;top:10px;left:10px;background:var(--primary);
    color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px;}

  .mg-card.locked{background:#171922;}
  .mg-card.locked .mg-ic{opacity:.45;}
  .mg-card.locked .mg-lock{position:absolute;top:9px;right:11px;font-size:14px;opacity:.75;}
  .mg-card.locked .mg-lb{color:var(--dim);font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:600;}

  /* Coming soon 모달 */
  .mg-modal{position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:24px;}
  .mg-modal.show{display:flex;}
  .mg-modal-box{width:100%;max-width:280px;background:var(--card-alt);
    border-radius:var(--r-card);padding:24px 20px;text-align:center;}
  .mg-modal-box h2{font-size:var(--fs-2xl);line-height:var(--lh-2xl);font-weight:700;}
  .mg-modal-box p{margin-top:10px;font-size:var(--fs-sm);line-height:1.6;color:var(--dim);}
  .mg-modal-box button{margin-top:18px;width:100%;height:var(--tap);border:0;
    border-radius:var(--r-field);background:var(--primary);color:#fff;
    font-family:inherit;font-size:var(--fs-lg);font-weight:700;cursor:pointer;}
</style>
</head>
<body data-demo="on">
<div class="app menu">
<div class="mg-enter">

  <header class="appbar-sub">
    <a class="back" href="index.html">‹</a>
    <h1>미니게임</h1>
  </header>

  <main class="scroll">
    <div class="mg-head">
      <div class="mg-title">KORAIL 미니게임</div>
      <div class="mg-sub">기차와 함께하는 즐거운 순간들</div>
    </div>

    <div class="mg-grid">
      <a class="mg-card railrun" href="game.html">
        <span class="mg-badge">NEW</span>
        <span class="mg-ic">🚄</span>
        <span class="mg-lb">레일런</span>
      </a>

      <div class="mg-card locked" data-soon-label="겨울 준비중">
        <span class="mg-lock">🔒</span>
        <span class="mg-ic">❓</span>
        <span class="mg-lb">겨울 준비중</span>
      </div>

      <div class="mg-card locked" data-soon-label="준비중">
        <span class="mg-lock">🔒</span>
        <span class="mg-ic">❓</span>
        <span class="mg-lb">준비중</span>
      </div>
    </div>

    <div class="tail"></div>
  </main>

</div>
</div>

<div class="mg-modal" id="mgModal" role="dialog" aria-modal="true" aria-label="Coming soon">
  <div class="mg-modal-box">
    <h2>곧 만나요!</h2>
    <p>다음 업데이트에서 새로운 미니게임을 공개할 예정이에요.</p>
    <button id="mgModalClose" type="button">확인</button>
  </div>
</div>

<script>
const mgModal = document.getElementById('mgModal');
document.querySelectorAll('.mg-card.locked').forEach(card=>{
  card.addEventListener('click', ()=> mgModal.classList.add('show'));
});
document.getElementById('mgModalClose').addEventListener('click', ()=> mgModal.classList.remove('show'));
mgModal.addEventListener('click', e=>{ if(e.target===mgModal) mgModal.classList.remove('show'); });
</script>
</body>
</html>
